function tp20ManageExpenseMembers(){
  const t=trip(); const input=prompt('정산 멤버를 콤마(,)로 구분해서 입력해주세요.', (t.expenseMembers||[]).join(', ')); if(input==null)return;
  const arr=input.split(',').map(x=>x.trim()).filter(Boolean); if(arr.length){t.expenseMembers=[...new Set(arr)]; save(); renderTab(); toast('멤버를 저장했어요')}
}
function tp20DeleteExpense(id){
  if(!confirm('이 결제 내역을 삭제할까요?'))return;
  trip().expenses=trip().expenses.filter(x=>x.id!==id); save(); renderTab();
}
function tp20OpenExpenseForm(id=null){
  const t=trip(), e=id?t.expenses.find(x=>x.id===id):null;
  const members=t.expenseMembers||['나'];
  const shareRows=(selected)=>selected.map(m=>`<div class="share-row"><div>${esc(m)}</div><input type="number" step="0.01" name="share_${esc(m)}" value="${e?.shares?.[m]??''}" placeholder="금액"></div>`).join('');
  openSheet(`<h2>${e?'결제 내역 수정':'결제 내역 추가'}</h2>
    <form id="expenseForm">
      <div class="field"><label>지불일자</label><input type="date" name="date" value="${esc(e?.date||todayISO())}" required></div>
      <div class="field"><label>결제수단</label><select name="payMethod">${['카드','현금','계좌이체','기타'].map(x=>`<option ${e?.payMethod===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="field"><label>결제한 사람</label><select name="payer">${members.map(x=>`<option ${e?.payer===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
      <div class="field"><label>함께 결제한 사람</label><div class="members-grid">${members.map(m=>`<label class="pill-stat"><input type="checkbox" name="members" value="${esc(m)}" ${e? (e.members||[]).includes(m)?'checked':'': (m==='나'?'checked':'')} style="margin-right:6px">${esc(m)}</label>`).join('')}</div></div>
      <div class="field"><label>결제한 곳</label><input name="merchant" value="${esc(e?.merchant||'')}" placeholder="예: Blue Bottle Coffee"></div>
      <div class="field"><label>카테고리</label><select name="category">${t.expenseCategories.map(x=>`<option ${e?.category===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
      <div class="field"><label>얼마 결제했는지</label><input type="number" step="0.01" name="amount" value="${esc(e?.amount||'')}" required></div>
      <div class="field"><label>통화</label><select name="currency" id="expCurrency">${['JPY','KRW','USD','EUR'].map(x=>`<option ${e?.currency===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="field"><label>환율 기준</label><select name="rateMode" id="rateMode"><option value="historic" ${(e?.rateMode||'historic')==='historic'?'selected':''}>결제일 환율</option><option value="current" ${e?.rateMode==='current'?'selected':''}>현재 환율</option><option value="manual" ${e?.rateMode==='manual'?'selected':''}>직접 입력</option></select><div class="rate-help">결제일 환율 / 현재 환율 / 직접 입력 중 선택할 수 있어요.</div></div>
      <div class="field" id="manualRateField" style="display:${e?.rateMode==='manual'?'block':'none'}"><label id="manualRateLabel">직접 입력 환율</label><input type="number" step="0.0001" name="manualRateInput" value="${esc(e?.manualRateInput||'')}" placeholder="예: 910 (100 JPY 기준)"></div>
      <div class="field"><label>정산 방식</label><select name="splitMode" id="splitMode"><option value="equal" ${(e?.splitMode||'equal')==='equal'?'selected':''}>동일하게 나누기 (1/N)</option><option value="custom" ${e?.splitMode==='custom'?'selected':''}>직접 나누기</option></select></div>
      <div class="field" id="shareField" style="display:${e?.splitMode==='custom'?'block':'none'}"><label>사람별 금액 입력</label><div class="share-grid" id="shareGrid">${shareRows(e?.members||['나'])}</div><div class="notice-inline">합계가 전체 결제금액과 같아야 저장됩니다.</div></div>
      <div class="field"><label>메모</label><textarea name="memo" rows="3" placeholder="선택사항">${esc(e?.memo||'')}</textarea></div>
      <div class="form-actions"><button type="button" class="ghost" onclick="closeSheet()">취소</button><button class="primary" id="expenseSaveBtn">저장</button></div>
    </form>`);
  const form=$('#expenseForm');
  function unitLabel(cur){return cur==='JPY'?'100 JPY = ? KRW':`1 ${cur} = ? KRW`;}
  function selectedMembers(){return [...form.querySelectorAll('input[name="members"]:checked')].map(x=>x.value)}
  function refreshManualRateLabel(){$('#manualRateLabel').textContent=unitLabel($('#expCurrency').value)}
  function refreshShareGrid(){
    const show=$('#splitMode').value==='custom';
    $('#shareField').style.display=show?'block':'none';
    if(show)$('#shareGrid').innerHTML=selectedMembers().map(m=>`<div class="share-row"><div>${esc(m)}</div><input type="number" step="0.01" name="share_${esc(m)}" value="${esc(e?.shares?.[m]??'')}" placeholder="금액"></div>`).join('');
  }
  $('#rateMode').onchange=()=>{$('#manualRateField').style.display=$('#rateMode').value==='manual'?'block':'none';refreshManualRateLabel()};
  $('#expCurrency').onchange=refreshManualRateLabel;
  [...form.querySelectorAll('input[name="members"]')].forEach(x=>x.onchange=refreshShareGrid);
  $('#splitMode').onchange=refreshShareGrid;
  refreshManualRateLabel();
  form.onsubmit=async ev=>{
    ev.preventDefault();
    const fd=new FormData(form);
    const membersSel=[...form.querySelectorAll('input[name="members"]:checked')].map(x=>x.value);
    if(!membersSel.length){alert('함께 결제한 사람을 한 명 이상 선택해주세요.');return}
    const amount=Number(fd.get('amount')||0); if(amount<=0){alert('결제금액을 확인해주세요.');return}
    let shares={};
    if(fd.get('splitMode')==='equal'){
      const per=amount/membersSel.length;
      membersSel.forEach((m,idx)=>shares[m]=Number((idx===membersSel.length-1? amount-per*(membersSel.length-1):per).toFixed(2)));
    }else{
      let sum=0;
      membersSel.forEach(m=>{shares[m]=Number(fd.get('share_'+m)||0); sum+=shares[m]});
      if(Math.abs(sum-amount)>0.01){alert('직접 나누기 합계가 전체 결제금액과 같아야 합니다.');return}
    }
    const saveBtn=$('#expenseSaveBtn'); const oldTxt=saveBtn.textContent; saveBtn.disabled=true; saveBtn.textContent='저장 중…';
    try{
      const currency=String(fd.get('currency')||'JPY');
      const mode=String(fd.get('rateMode')||'historic');
      const manualRateInput=fd.get('manualRateInput')||'';
      const rateInfo=await tp20FetchRateFor(String(fd.get('date')), currency, mode, manualRateInput);
      const krwAmount=Math.round(currency==='KRW'? amount : amount*rateInfo.rate);
      const shareKrw={}; Object.entries(shares).forEach(([k,v])=>shareKrw[k]=Math.round(currency==='KRW'? Number(v): Number(v)*rateInfo.rate));
      const obj={
        id:e?.id||uid(),
        createdAt:e?.createdAt||Date.now(),
        date:String(fd.get('date')), dayLabel:tp20DayLabel(String(fd.get('date')), t),
        payMethod:String(fd.get('payMethod')), payer:String(fd.get('payer')),
        members:membersSel, merchant:String(fd.get('merchant')||''), amount, currency,
        category:String(fd.get('category')||'기타'), rateMode:mode, rate:rateInfo.rate, rateDate:rateInfo.rateDate, rateDisplay:rateInfo.display, manualRateInput,
        splitMode:String(fd.get('splitMode')||'equal'), shares, shareKrw, krwAmount, memo:String(fd.get('memo')||'')
      };
      if(e){Object.assign(e,obj)} else t.expenses.push(obj);
      save(); closeSheet(); renderTab(); toast('결제 내역을 저장했어요');
    }catch(err){
      alert('환율 정보를 불러오지 못했습니다.\n\n'+(err?.message||err));
    }finally{
      saveBtn.disabled=false; saveBtn.textContent=oldTxt;
    }
  };
}

function tp20RenderExpenseGroups(t){
  const items=[...t.expenses].sort((a,b)=>(a.date||'').localeCompare(b.date||'')||((a.createdAt||0)-(b.createdAt||0)));
  if(!items.length)return `<div class="empty-note2">아직 등록한 정산 내역이 없습니다.</div>`;
  if(expenseView==='all')return items.map(tp20ExpenseCard).join('');
  if(expenseView==='category'){
    const groups=[...new Set(items.map(x=>x.category))];
    return groups.map(g=>`<div class="group-title2">${esc(g)} · ${tp20FmtKRW(items.filter(x=>x.category===g).reduce((a,b)=>a+Number(b.krwAmount||0),0))}</div>${items.filter(x=>x.category===g).map(tp20ExpenseCard).join('')}`).join('');
  }
  if(expenseView==='day'){
    const order=(label)=>label==='여행 전'?-1:label==='여행 후'?999:Number(label.replace('일차',''))||0;
    const groups=[...new Set(items.map(x=>x.dayLabel||''))].sort((a,b)=>order(a)-order(b));
    return groups.map(g=>`<div class="group-title2">${esc(g)} · ${tp20FmtKRW(items.filter(x=>(x.dayLabel||'')===g).reduce((a,b)=>a+Number(b.krwAmount||0),0))}</div>${items.filter(x=>(x.dayLabel||'')===g).map(tp20ExpenseCard).join('')}`).join('');
  }
  const people=t.expenseMembers||[];
  return people.map(p=>{
    const filtered=items.filter(x=>(x.members||[]).includes(p));
    if(!filtered.length)return '';
    const total=filtered.reduce((a,b)=>a+Number((b.shareKrw||{})[p]||0),0);
    return `<div class="group-title2">${esc(p)} · ${tp20FmtKRW(total)}</div>${filtered.map(tp20ExpenseCard).join('')}`;
  }).join('');
}

function tp21HumanMoney(n){
  n=Math.floor(Math.abs(Number(n)||0)); if(!n)return '0원';
  const under=x=>{let p=[]; const vals=[[1000,'천'],[100,'백'],[10,'십']]; vals.forEach(([v,u])=>{const q=Math.floor(x/v); if(q){p.push(q+u); x%=v}}); if(x)p.push(String(x)); return p.join(' ')};
  let parts=[]; const e=Math.floor(n/100000000); if(e){parts.push(under(e)+'억'); n%=100000000}
  const m=Math.floor(n/10000); if(m){parts.push(under(m)+'만'); n%=10000}
  if(n)parts.push(under(n));
  return parts.join(' ')+'원';
}

let tp22ExpenseRateMode='saved';
const tp22RateCache={};
function tp22RateModeLabel(mode){return mode==='historic'?'결제일 환율':mode==='current'?'현재 환율':mode==='manual'?'직접 입력':mode==='saved'?'저장된 환율':'저장된 환율'}
function tp22LaunchRateFetch(e,mode){
  const key=[e.id,mode,e.date,e.currency,e.amount,e.manualRateInput||''].join('|');
  if(tp22RateCache[key])return;
  tp22RateCache[key]={status:'pending'};
  tp20FetchRateFor(e.date,e.currency,mode,e.manualRateInput).then(info=>{
    tp22RateCache[key]={status:'done',rate:info.rate,rateDate:info.rateDate,display:info.display,krwAmount:Math.round(Number(e.amount||0)*info.rate)};
    if(currentTab==='expense') renderTab();
  }).catch(err=>{
    tp22RateCache[key]={status:'error',error:String(err?.message||err)};
    if(currentTab==='expense') renderTab();
  });
}
function tp22GetExpenseViewData(e,mode=tp22ExpenseRateMode){
  const foreign=tp20FmtMoney(e.amount,e.currency);
  if(mode==='saved')return {krw:Number(e.krwAmount||0),foreign,display:e.rateDisplay||'',rateDate:e.rateDate||'',sourceLabel:tp22RateModeLabel(e.rateMode||'historic'),pending:false,error:''};
  if(e.currency==='KRW')return {krw:Number(e.amount||0),foreign,display:'원화 결제',rateDate:e.date||todayISO(),sourceLabel:'원화 결제',pending:false,error:''};
  const key=[e.id,mode,e.date,e.currency,e.amount,e.manualRateInput||''].join('|');
  const cached=tp22RateCache[key];
  if(cached?.status==='done')return {krw:Number(cached.krwAmount||0),foreign,display:cached.display||'',rateDate:cached.rateDate||'',sourceLabel:tp22RateModeLabel(mode),pending:false,error:''};
  if(cached?.status==='error')return {krw:Number(e.krwAmount||0),foreign,display:e.rateDisplay||'',rateDate:e.rateDate||'',sourceLabel:tp22RateModeLabel(mode),pending:false,error:cached.error||'환율 계산 실패'};
  tp22LaunchRateFetch(e,mode);
  return {krw:Number(e.krwAmount||0),foreign,display:'환율 계산 중…',rateDate:'',sourceLabel:tp22RateModeLabel(mode),pending:true,error:''};
}
function tp22ExpenseShareKrw(e,displayKrw){
  const members=(e.members||[]).length?(e.members||[]):[e.payer||'나'];
  const entries=Object.entries(e.shares||{});
  if(entries.length){
    const total=entries.reduce((a,[,v])=>a+Number(v||0),0)||1;
    let remain=Math.round(displayKrw||0);
    const out={};
    entries.forEach(([name,val],idx)=>{
      let amt=idx===entries.length-1?remain:Math.round((Number(val||0)/total)*Number(displayKrw||0));
      out[name]=amt; remain-=amt;
    });
    return out;
  }
  const out={};
  let remain=Math.round(displayKrw||0), len=members.length||1;
  members.forEach((m,idx)=>{const amt=idx===len-1?remain:Math.round(Number(displayKrw||0)/len); out[m]=amt; remain-=amt;});
  return out;
}
function tp22ExpenseStatsDisplay(t){
  const stats={totalKrw:0,byCategory:{},byDay:{},byCurrency:{},pending:0};
  (t.expenses||[]).forEach(e=>{
    const d=tp22GetExpenseViewData(e,tp22ExpenseRateMode);
    const val=Number(d.krw||0); stats.totalKrw+=val; if(d.pending)stats.pending+=1;
    stats.byCategory[e.category]=(stats.byCategory[e.category]||0)+val;
    const day=e.dayLabel||tp20DayLabel(e.date,t); stats.byDay[day]=(stats.byDay[day]||0)+val;
    stats.byCurrency[e.currency]=(stats.byCurrency[e.currency]||0)+Number(e.amount||0);
  });
  return stats;
}

function tp23OriginalShares(e){
  const members=(e.members||[]).length?e.members:[e.payer||'나'],amount=Number(e.amount||0),src=e.shares||{};
  const present=members.filter(m=>src[m]!=null);
  if(present.length===members.length && present.reduce((a,m)=>a+Number(src[m]||0),0)>0){
    const total=present.reduce((a,m)=>a+Number(src[m]||0),0),out={};let remain=amount;
    present.forEach((m,i)=>{const val=i===present.length-1?remain:Number((amount*(Number(src[m]||0)/total)).toFixed(2));out[m]=val;remain=Number((remain-val).toFixed(2))});return out;
  }
  const out={},per=amount/members.length;let remain=amount;
  members.forEach((m,i)=>{const val=i===members.length-1?remain:Number(per.toFixed(2));out[m]=val;remain=Number((remain-val).toFixed(2))});return out;
}
function tp23MatchTransfers(net,currency='KRW'){
  const creditors=Object.entries(net).filter(([,v])=>v>.01).map(([p,v])=>({p,amt:Number(v)})).sort((a,b)=>b.amt-a.amt);
  const debtors=Object.entries(net).filter(([,v])=>v<-.01).map(([p,v])=>({p,amt:-Number(v)})).sort((a,b)=>b.amt-a.amt);
  const arr=[];let i=0,j=0;
  while(i<debtors.length&&j<creditors.length){
    const amt=Math.min(debtors[i].amt,creditors[j].amt);
    if(amt>.01)arr.push({currency,from:debtors[i].p,to:creditors[j].p,amount:currency==='KRW'?Math.round(amt):Number(amt.toFixed(2))});
    debtors[i].amt-=amt;creditors[j].amt-=amt;
    if(debtors[i].amt<=.01)i++;if(creditors[j].amt<=.01)j++;
  }
  return arr;
}
function tp23SettlementKrw(t){

  (t.expenses||[]).forEach(e=>{const d=tp22GetExpenseViewData(e,tp22ExpenseRateMode),val=Number(d.krw||0),shares=tp22ExpenseShareKrw(e,val);net[e.payer]=(net[e.payer]||0)+val;Object.entries(shares).forEach(([p,v])=>net[p]=(net[p]||0)-Number(v||0))});
  return {net,transfers:tp23MatchTransfers(net,'KRW')};
}
function tp23SettlementOriginal(t){
  const nets={};
  (t.expenses||[]).forEach(e=>{const c=e.currency||'KRW';nets[c]=nets[c]||{};(t.expenseMembers||[]).forEach(m=>{if(nets[c][m]==null)nets[c][m]=0});const shares=tp23OriginalShares(e);nets[c][e.payer]=(nets[c][e.payer]||0)+Number(e.amount||0);Object.entries(shares).forEach(([p,v])=>nets[c][p]=(nets[c][p]||0)-Number(v||0))});
  const transfers=[];Object.entries(nets).forEach(([c,net])=>transfers.push(...tp23MatchTransfers(net,c)));
  return {nets,transfers};
}

  const arr=[...new Set((t.expenses||[]).map(x=>x.currency).filter(Boolean).filter(c=>c!=='KRW'))];
  return arr.length?arr:['JPY'];
}
function tp24RateUnit(cur){return cur==='JPY'?100:1}
function tp24RatePlaceholder(cur){return cur==='JPY'?'예: 910 (100 JPY 기준)':'예: 1350 (1 '+cur+' 기준)'}
function tp24SelectCustomCurrency(v){tp24CustomRateCurrency=v;renderTab()}
function tp24ApplyCustomRate(){
  const input=document.getElementById('tp24CustomRateInput');
  if(!input)return;
  const raw=String(input.value||'').trim();
  if(!raw || Number(raw)<=0){alert('환율 값을 입력해주세요.'); return}
  tp24CustomRates[tp24CustomRateCurrency]=raw;
  renderTab();
  toast('지정 환율을 저장했어요');
}
function tp24CurrentCustomInput(){return tp24CustomRates[tp24CustomRateCurrency]||''}
function tp24RateModeLabel(mode){return mode==='custom'?'지정 환율':tp22RateModeLabel(mode)}
function tp22GetExpenseViewData(e,mode=tp22ExpenseRateMode){
  const foreign=tp20FmtMoney(e.amount,e.currency);
  if(mode==='saved')return {krw:Number(e.krwAmount||0),foreign,display:e.rateDisplay||'',rateDate:e.rateDate||'',sourceLabel:tp24RateModeLabel(e.rateMode||'historic'),pending:false,error:''};
  if(e.currency==='KRW')return {krw:Number(e.amount||0),foreign,display:'원화 결제',rateDate:e.date||todayISO(),sourceLabel:'원화 결제',pending:false,error:''};
  if(mode==='custom'){
    const stored=Number(tp24CustomRates[e.currency]||0);
    if(stored>0){
      const unit=tp24RateUnit(e.currency);
      const rate=stored/unit;
      return {krw:Math.round(Number(e.amount||0)*rate),foreign,display:`${unit} ${e.currency} = ${tp20FmtNum(stored)} KRW`,rateDate:'custom-global',sourceLabel:'지정 환율',pending:false,error:''};
    }
    return {krw:Number(e.krwAmount||0),foreign,display:'지정 환율 미입력 · 저장된 환율 사용',rateDate:e.rateDate||'',sourceLabel:'지정 환율',pending:false,error:''};
  }
  const key=[e.id,mode,e.date,e.currency,e.amount,e.manualRateInput||''].join('|');
  const cached=tp22RateCache[key];
  if(cached?.status==='done')return {krw:Number(cached.krwAmount||0),foreign,display:cached.display||'',rateDate:cached.rateDate||'',sourceLabel:tp24RateModeLabel(mode),pending:false,error:''};
  if(cached?.status==='error')return {krw:Number(e.krwAmount||0),foreign,display:e.rateDisplay||'',rateDate:e.rateDate||'',sourceLabel:tp24RateModeLabel(mode),pending:false,error:cached.error||'환율 계산 실패'};
  tp22LaunchRateFetch(e,mode);
  return {krw:Number(e.krwAmount||0),foreign,display:'환율 계산 중…',rateDate:'',sourceLabel:tp24RateModeLabel(mode),pending:true,error:''};
}

/* ===== v26 rate mode correctness ===== */
function tp26IsFutureDate(date){return !!date && date>todayISO()}
function tp26RateCacheKey(e,mode,actualMode,dateKey){return [e.id,mode,actualMode,dateKey,e.currency,e.amount].join('|')}
function tp26StartRateFetch(e,requestedMode){
  const futureHistoric=requestedMode==='historic'&&tp26IsFutureDate(e.date);
  const actualMode=futureHistoric?'current':requestedMode;
  const dateKey=actualMode==='current'?'latest':e.date;
  const key=tp26RateCacheKey(e,requestedMode,actualMode,dateKey);
  const existing=tp22RateCache[key];
  if(existing)return {key,existing,futureHistoric,actualMode};
  tp22RateCache[key]={status:'pending'};
  tp20FetchRateFor(e.date,e.currency,actualMode,'').then(info=>{
    tp22RateCache[key]={status:'done',rate:info.rate,rateDate:info.rateDate,display:info.display,krwAmount:Math.round(Number(e.amount||0)*info.rate),futureHistoric};
    if(currentTab==='expense')renderTab();
  }).catch(err=>{
    tp22RateCache[key]={status:'error',error:String(err?.message||err),futureHistoric};
    if(currentTab==='expense')renderTab();
  });
  return {key,existing:null,futureHistoric,actualMode};
}
function tp22GetExpenseViewData(e,mode=null){
  const t=tp25EnsureRateSettings(trip()),useMode=mode||t.expenseRateMode||'historic',foreign=tp20FmtMoney(e.amount,e.currency);
  if(e.currency==='KRW')return {krw:Number(e.amount||0),foreign,display:'원화 결제',rateDate:e.date||todayISO(),sourceLabel:'원화 결제',pending:false,error:'',provisional:false};
  if(useMode==='custom'){
    const stored=Number((t.expenseCustomRates||{})[e.currency]||0);
    if(stored>0){const unit=tp25RateUnit(e.currency),rate=stored/unit;return {krw:Math.round(Number(e.amount||0)*rate),foreign,display:`${unit} ${e.currency} = ${tp20FmtNum(stored)} KRW`,rateDate:'trip-custom',sourceLabel:'지정 환율',pending:false,error:'',provisional:false}}
    return {krw:null,foreign,display:`${e.currency} 지정 환율 미등록`,rateDate:'',sourceLabel:'지정 환율',pending:false,error:'지정 환율 미등록',provisional:false};
  }
  const fetchState=tp26StartRateFetch(e,useMode),cached=tp22RateCache[fetchState.key];
  if(cached?.status==='done'){
    return {krw:Number(cached.krwAmount||0),foreign,display:cached.display||'',rateDate:cached.rateDate||'',sourceLabel:fetchState.futureHistoric?'결제일 환율':tp25RateModeLabel(useMode),pending:false,error:'',provisional:!!fetchState.futureHistoric};
  }
  if(cached?.status==='error'){
    return {krw:null,foreign,display:'환율 조회 실패',rateDate:'',sourceLabel:tp25RateModeLabel(useMode),pending:false,error:cached.error||'환율 계산 실패',provisional:false};
  }
  return {krw:null,foreign,display:fetchState.futureHistoric?'미래 결제일 · 현재 환율 임시 조회 중…':'환율 계산 중…',rateDate:'',sourceLabel:tp25RateModeLabel(useMode),pending:true,error:'',provisional:!!fetchState.futureHistoric};
}
function tp22ExpenseStatsDisplay(t){
  tp25EnsureRateSettings(t);const stats={totalKrw:0,byCategory:{},byDay:{},byCurrency:{},pending:0,missing:0};
  (t.expenses||[]).forEach(e=>{const d=tp22GetExpenseViewData(e,t.expenseRateMode);if(d.krw==null){if(d.pending)stats.pending++;else stats.missing++}else{const val=Number(d.krw||0);stats.totalKrw+=val;stats.byCategory[e.category]=(stats.byCategory[e.category]||0)+val;const day=e.dayLabel||tp20DayLabel(e.date,t);stats.byDay[day]=(stats.byDay[day]||0)+val}stats.byCurrency[e.currency]=(stats.byCurrency[e.currency]||0)+Number(e.amount||0)});return stats;
}
function tp23TotalArea(t){
  tp25EnsureRateSettings(t);const stats=tp22ExpenseStatsDisplay(t);return `<div class="exp-total-area"><div class="exp-total-head">총 결제</div><div class="exp-total-main"><div><div class="exp-total-krw">${tp20FmtKRW(stats.totalKrw)}</div><div class="exp-total-rate">${tp25RateModeLabel(t.expenseRateMode)} 기준 원화 환산 합계${stats.pending?` · ${stats.pending}건 계산 중`:''}${stats.missing?` · ${stats.missing}건 환율 확인 필요`:''}</div></div><div class="exp-currency-totals">${tp23CurrencyTotalsHtml(stats)}</div></div></div>`;
}
function tp23ExpenseRow(e){
  const d=tp22GetExpenseViewData(e,tp25EnsureRateSettings(trip()).expenseRateMode),open=tp21IsExpenseOpen(e.id),krwText=d.krw==null?'—':tp20FmtKRW(d.krw);
  return `<div class="exp-flat-row"><div class="exp-flat-main" onclick="tp21ToggleExpenseDetail('${e.id}')"><div class="exp-icon">${esc(tp23CategoryIcon(e.category))}</div><div class="exp-list-info"><div class="exp-list-tags"><span class="exp-list-tag">${esc(e.category||'기타')}</span>${e.dayLabel?`<span class="exp-list-tag day">${esc(e.dayLabel)}</span>`:''}</div><div class="exp-list-merchant">${esc(e.merchant||'결제 내역')}</div><div class="exp-list-date">${fmt(e.date)}</div></div><div class="exp-money-pair"><div class="exp-money-cell"><div class="exp-money-label">결제 통화</div><div class="exp-money-val">${d.foreign}</div></div><div class="exp-money-cell krw"><div class="exp-money-label">원화 환산${d.provisional?`<span class="rate-provisional">임시</span>`:''}</div><div class="exp-money-val">${krwText}</div></div></div></div>${open?`<div class="exp-list-detail"><div class="exp-detail-panel"><div class="exp-detail-line">결제수단 ${esc(e.payMethod||'-')} · 결제자 ${esc(e.payer||'-')}</div><div class="exp-detail-line">함께 결제한 사람 ${(e.members||[]).length?esc(e.members.join(', ')):'-'}</div><div class="exp-detail-line">환율 ${esc(d.sourceLabel)}${d.display?` · ${esc(d.display)}`:''}${d.rateDate?` · ${esc(d.rateDate)}`:''}${d.provisional?' · 미래 결제일이라 현재 최신 환율을 임시 적용 중':''}</div>${d.error?`<div class="exp-detail-line rate-error-note">${esc(d.error)}</div>`:''}${e.memo?`<div class="exp-detail-line">메모 ${esc(e.memo)}</div>`:''}<div class="exp-detail-actions"><button onclick="event.stopPropagation();tp20OpenExpenseForm('${e.id}')">수정</button><button onclick="event.stopPropagation();tp20DeleteExpense('${e.id}')">삭제</button></div></div></div>`:''}</div>`;
}
function tp23SettlementKrw(t){
  tp25EnsureRateSettings(t);const net={};(t.expenseMembers||[]).forEach(m=>net[m]=0);(t.expenses||[]).forEach(e=>{const d=tp22GetExpenseViewData(e,t.expenseRateMode);if(d.krw==null)return;const val=Number(d.krw||0),shares=tp22ExpenseShareKrw(e,val);net[e.payer]=(net[e.payer]||0)+val;Object.entries(shares).forEach(([p,v])=>net[p]=(net[p]||0)-Number(v||0))});return {net,transfers:tp23MatchTransfers(net,'KRW')};
}
function tp25SetTripRateMode(mode){
  const t=tp25EnsureRateSettings(trip());
  if(!['historic','current','custom'].includes(mode))mode='historic';
  t.expenseRateMode=mode;save();renderTrip();
}
state.trips.forEach(t=>{tp25EnsureRateSettings(t);if(t.expenseRateMode==='saved')t.expenseRateMode='historic'});save();

<script>

  const t=trip();

  t.expenseCustomRates = t.expenseCustomRates || {};

}
function tp24CurrentCustomInput(){
  const store=tp24GetTripRateStore();
  return store[tp24CustomRateCurrency]||'';
}
function tp24ApplyCustomRate(){
  const input=document.getElementById('tp24CustomRateInput');
  if(!input)return;
  const raw=String(input.value||'').trim();
  if(!raw || Number(raw)<=0){alert('환율 값을 입력해주세요.'); return}

function tp22GetExpenseViewData(e,mode=tp22ExpenseRateMode){
  const foreign=tp20FmtMoney(e.amount,e.currency);
  if(mode==='saved')return {krw:Number(e.krwAmount||0),foreign,display:e.rateDisplay||'',rateDate:e.rateDate||'',sourceLabel:tp24RateModeLabel(e.rateMode||'historic'),pending:false,error:''};
  if(e.currency==='KRW')return {krw:Number(e.amount||0),foreign,display:'원화 결제',rateDate:e.date||todayISO(),sourceLabel:'원화 결제',pending:false,error:''};

      const rate=stored/unit;
      return {krw:Math.round(Number(e.amount||0)*rate),foreign,display:`${unit} ${e.currency} = ${tp20FmtNum(stored)} KRW`,rateDate:'custom-global',sourceLabel:'지정 환율',pending:false,error:''};

  }
  const key=[e.id,mode,e.date,e.currency,e.amount,e.manualRateInput||''].join('|');
  const cached=tp22RateCache[key];
  if(cached?.status==='done')return {krw:Number(cached.krwAmount||0),foreign,display:cached.display||'',rateDate:cached.rateDate||'',sourceLabel:tp24RateModeLabel(mode),pending:false,error:''};
  if(cached?.status==='error')return {krw:Number(e.krwAmount||0),foreign,display:e.rateDisplay||'',rateDate:e.rateDate||'',sourceLabel:tp24RateModeLabel(mode),pending:false,error:cached.error||'환율 계산 실패'};

save();

<script>
/* ===== v25 trip-wide exchange-rate settings ===== */
const TP25_CURRENCIES=['JPY','USD','EUR','CNY','TWD','HKD','THB','SGD','AUD','CAD','GBP','CHF','VND','PHP','MYR','IDR','NZD'];
function tp25EnsureRateSettings(t){
  if(!t)return t;
  if(!['historic','current','custom'].includes(t.expenseRateMode)) t.expenseRateMode='historic';
  t.expenseCustomRates=t.expenseCustomRates||{};

<script>
/* ===== v27 strict exchange-rate mode switching ===== */
function tp27ClearRateCache(){
  Object.keys(tp22RateCache||{}).forEach(k=>delete tp22RateCache[k]);
}
function tp25SetTripRateMode(mode){

}
function tp27IsFutureDate(date){
  return !!date && date > todayISO();
}
function tp20FetchRateFor(date,currency,mode,manualInput){
  currency=currency||'JPY';
  if(currency==='KRW') return Promise.resolve({rate:1,rateDate:date||todayISO(),display:'원화 결제',provisional:false});
  if(mode==='manual'){

    if(!input || input<=0) return Promise.reject(new Error('직접 입력 환율을 확인해주세요.'));
    return Promise.resolve({rate:input/unit,rateDate:'manual',display:`${unit} ${currency} = ${tp20FmtNum(input)} KRW`,provisional:false});
  }
  const isFuture=mode==='historic' && tp27IsFutureDate(date);
  const base=mode==='current' || isFuture ? 'latest' : date;
  return fetch(`https://api.frankfurter.app/${base}?from=${currency}&to=KRW`)
    .then(r=>{if(!r.ok)throw new Error(`환율 API 응답 오류 (${r.status})`);return r.json()})
    .then(j=>{
      if(!j?.rates || j.rates.KRW==null) throw new Error('환율 정보를 불러오지 못했습니다.');
      const rate=Number(j.rates.KRW),unit=currency==='JPY'?100:1;
      return {rate,rateDate:j.date||base,display:`${unit} ${currency} = ${tp20FmtNum((rate*unit).toFixed(currency==='JPY'?2:4))} KRW`,provisional:isFuture};
    });
}
function tp22GetExpenseViewData(e,mode=null){

      const unit=tp25RateUnit(e.currency),rate=stored/unit;

  }

    return {krw:Number(cached.krwAmount||0),foreign,display:cached.display||'',rateDate:cached.rateDate||'',sourceLabel:tp25RateModeLabel(useMode),pending:false,error:'',provisional:!!cached.provisional};
  }

    return {krw:null,foreign,display:'환율 조회 실패',rateDate:'',sourceLabel:tp25RateModeLabel(useMode),pending:false,error:cached.error||'환율 계산 실패',provisional:false};
  }

    tp22RateCache[key]={status:'pending'};

      .then(info=>{

      });
  }
  return {krw:null,foreign,display:'환율 조회 중…',rateDate:'',sourceLabel:tp25RateModeLabel(useMode),pending:true,error:'',provisional:false};

<script>
/* ===== v28 Frankfurter current API endpoint fix ===== */
function tp28FrankfurterUrl(date,currency,mode){
  const isFuture = mode==='historic' && date && date > todayISO();
  if(mode==='current' || isFuture || !date){
    return `https://api.frankfurter.dev/v1/latest?base=${encodeURIComponent(currency)}&symbols=KRW`;
  }
  return `https://api.frankfurter.dev/v1/${encodeURIComponent(date)}?base=${encodeURIComponent(currency)}&symbols=KRW`;
}

function tp20FetchRateFor(date,currency,mode,manualInput){
  currency=currency||'JPY';

  if(currency==='KRW'){
    return Promise.resolve({
      rate:1,
      rateDate:date||todayISO(),
      display:'원화 결제',
      provisional:false
    });
  }

  if(mode==='manual'){
    const unit=currency==='JPY'?100:1;
    const input=Number(manualInput||0);
    if(!input || input<=0){
      return Promise.reject(new Error('직접 입력 환율을 확인해주세요.'));
    }
    return Promise.resolve({
      rate:input/unit,
      rateDate:'manual',
      display:`${unit} ${currency} = ${tp20FmtNum(input)} KRW`,
      provisional:false
    });
  }

  const isFuture = mode==='historic' && !!date && date > todayISO();
  const url = tp28FrankfurterUrl(date,currency,mode);

  return fetch(url)
    .then(async r=>{
      if(!r.ok){
        let detail='';
        try{detail=await r.text()}catch(_){}
        throw new Error(`환율 API 응답 오류 (${r.status})${detail?` · ${detail.slice(0,120)}`:''}`);
      }
      return r.json();
    })
    .then(j=>{
      if(!j || !j.rates || j.rates.KRW==null){
        throw new Error('KRW 환율 데이터가 없습니다.');
      }
      const rate=Number(j.rates.KRW);
      const unit=currency==='JPY'?100:1;
      return {
        rate,
        rateDate:j.date||date||'latest',
        display:`${unit} ${currency} = ${tp20FmtNum((rate*unit).toFixed(currency==='JPY'?2:4))} KRW`,
        provisional:isFuture
      };
    });
}

/* 결제일이 오늘인데 당일 기준값이 아직 공개되지 않았으면 latest로 한 번 더 시도 */
const tp28OriginalFetchRateFor = tp20FetchRateFor;
function tp28FetchRateWithTodayFallback(date,currency,mode,manualInput){
  return tp28OriginalFetchRateFor(date,currency,mode,manualInput).catch(err=>{
    if(mode==='historic' && date===todayISO() && currency!=='KRW'){
      return fetch(`https://api.frankfurter.dev/v1/latest?base=${encodeURIComponent(currency)}&symbols=KRW`)
        .then(async r=>{
          if(!r.ok) throw err;
          return r.json();
        })
        .then(j=>{
          if(!j?.rates || j.rates.KRW==null) throw err;
          const rate=Number(j.rates.KRW),unit=currency==='JPY'?100:1;
          return {
            rate,
            rateDate:j.date||'latest',
            display:`${unit} ${currency} = ${tp20FmtNum((rate*unit).toFixed(currency==='JPY'?2:4))} KRW`,
            provisional:true
          };
        });
    }
    throw err;
  });
}
tp20FetchRateFor = tp28FetchRateWithTodayFallback;

if(typeof tp27ClearRateCache==='function') tp27ClearRateCache();
</script>


<script>
/* ===== Trip Pocket Supabase shared storage v30 ===== */
const TP_SUPABASE_URL='https://ylpgfhgjbwylqpximjvo.supabase.co';
const TP_SUPABASE_PUBLISHABLE_KEY='sb_publishable_K8dmOuN7YAv2tt3BvAUwLA_EntXrrrv';
const TP_CLOUD_MIGRATED_KEY='tripPocket_supabase_migrated_v1';

let tpSb=null;
let tpCloudSession=null;
let tpCloudRealtime=null;
let tpCloudSyncTimer=null;
let tpCloudReadyForAutoSync=false;
let tpCloudApplyingRemote=false;
let tpCloudSyncing=false;
let tpCloudLastMessage='아직 연결하지 않았어요.';
let tpCloudLastError='';
const tpCloudBaseline=new Map();
const tpCloudMeta=new Map();

function tpCloudJson(v){try{return JSON.stringify(v)}catch(_){return ''}}
function tpCloudSetDot(mode='off'){
  const dot=document.getElementById('cloudStatusDot');
  if(!dot)return;
  dot.className='cloud-status-dot'+(mode==='online'?' online':mode==='syncing'?' syncing':mode==='error'?' error':'');
}
function tpCloudUpdateButton(){
  if(tpCloudSyncing)tpCloudSetDot('syncing');
  else if(tpCloudLastError)tpCloudSetDot('error');
  else if(tpCloudSession)tpCloudSetDot('online');
  else tpCloudSetDot('off');
}
function tpCloudSetStatus(message,{error=false}={}){
  tpCloudLastMessage=message||'';
  tpCloudLastError=error?String(message||'오류'):'';
  tpCloudUpdateButton();
  if(document.getElementById('cloudBack')?.classList.contains('show'))tpCloudRenderModal();
}
function tpCloudSafeTrip(t){
  const copy=JSON.parse(JSON.stringify(t));
  normalizeTrip(copy);
  return copy;
}
function tpCloudStoreLocalOnly(){
  localStorage.setItem(KEY,JSON.stringify(state));
}
function tpCloudCurrentUser(){return tpCloudSession?.user||null}
function tpCloudIsMigrated(){return localStorage.getItem(TP_CLOUD_MIGRATED_KEY)==='1'}
function tpCloudMarkMigrated(){localStorage.setItem(TP_CLOUD_MIGRATED_KEY,'1')}

window.tpCloudQueueSync=function(){
  if(tpCloudApplyingRemote || !tpCloudSession || !tpCloudReadyForAutoSync)return;
  clearTimeout(tpCloudSyncTimer);
  tpCloudSyncTimer=setTimeout(()=>tpCloudSyncDirtyTrips(),700);
};

async function tpCloudSyncOne(t){
  if(!tpCloudSession)return;
  const data=tpCloudSafeTrip(t);
  const snap=tpCloudJson(data);
  if(tpCloudBaseline.get(t.id)===snap)return;

  const {data:existing,error:readErr}=await tpSb.from('trips').select('id,owner_id').eq('id',t.id).maybeSingle();
  if(readErr)throw readErr;

  if(existing){
    const {error}=await tpSb.from('trips').update({name:data.name||'',data}).eq('id',t.id);
    if(error)throw error;
    tpCloudMeta.set(t.id,{...(tpCloudMeta.get(t.id)||{}),owner_id:existing.owner_id});
  }else{
    const {data:created,error}=await tpSb.from('trips').insert({id:t.id,name:data.name||'',data}).select('id,owner_id,updated_at').single();
    if(error)throw error;
    if(created)tpCloudMeta.set(t.id,created);
  }
  tpCloudBaseline.set(t.id,snap);
}
async function tpCloudSyncDirtyTrips(){
  if(!tpCloudSession || !tpCloudReadyForAutoSync || tpCloudSyncing)return;
  tpCloudSyncing=true;tpCloudLastError='';tpCloudUpdateButton();
  try{
    let changed=0;
    for(const t of state.trips||[]){
      const snap=tpCloudJson(tpCloudSafeTrip(t));
      if(tpCloudBaseline.get(t.id)!==snap){await tpCloudSyncOne(t);changed++}
    }
    tpCloudLastMessage=changed?`${changed}개 여행을 Supabase에 저장했어요.`:'모든 여행이 최신 상태예요.';
  }catch(err){
    console.error('Supabase sync failed',err);
    tpCloudLastError=err?.message||String(err);
    tpCloudLastMessage='동기화에 실패했어요.';
  }finally{
    tpCloudSyncing=false;tpCloudUpdateButton();
    if(document.getElementById('cloudBack')?.classList.contains('show'))tpCloudRenderModal();
  }
}
async function tpCloudUploadAllLocal(){
  if(!tpCloudSession)return tpCloudSetStatus('먼저 로그인해주세요.',{error:true});
  if(!(state.trips||[]).length)return tpCloudSetStatus('올릴 로컬 여행 데이터가 없습니다.');
  const ok=confirm(`현재 브라우저의 여행 ${(state.trips||[]).length}개를 Supabase에 올릴까요?\n같은 여행 ID가 이미 있으면 현재 로컬 내용으로 업데이트됩니다.`);
  if(!ok)return;
  tpCloudSyncing=true;tpCloudLastError='';tpCloudUpdateButton();tpCloudRenderModal();
  try{
    for(const t of state.trips||[]){
      tpCloudBaseline.delete(t.id);
      await tpCloudSyncOne(t);
    }
    tpCloudMarkMigrated();
    tpCloudReadyForAutoSync=true;
    tpCloudLastMessage=`로컬 여행 ${(state.trips||[]).length}개를 Supabase에 올렸어요.`;
    toast('Supabase 업로드 완료');
  }catch(err){
    console.error(err);
    tpCloudLastError=err?.message||String(err);
    tpCloudLastMessage='로컬 데이터 업로드에 실패했어요.';
    alert('Supabase 업로드에 실패했습니다.\n\n'+(err?.message||err));
  }finally{
    tpCloudSyncing=false;tpCloudUpdateButton();tpCloudRenderModal();
  }
}
async function tpCloudFetchRows(){
  const {data,error}=await tpSb.from('trips').select('id,owner_id,name,data,updated_at').order('updated_at',{ascending:true});
  if(error)throw error;
  return data||[];
}
async function tpCloudLoadRemote({manual=false}={}){
  if(!tpCloudSession)return;
  tpCloudSyncing=true;tpCloudLastError='';tpCloudUpdateButton();
  try{
    const hadLocal=(state.trips||[]).length>0;
    const rows=await tpCloudFetchRows();

    rows.forEach(r=>{
      if(r?.data){
        normalizeTrip(r.data);
        tpCloudBaseline.set(r.id,tpCloudJson(tpCloudSafeTrip(r.data)));
        tpCloudMeta.set(r.id,{owner_id:r.owner_id,updated_at:r.updated_at,name:r.name});
      }
    });

    if(!rows.length && hadLocal && !tpCloudIsMigrated()){
      tpCloudReadyForAutoSync=false;
      tpCloudLastMessage='기존 로컬 여행이 있어요. 「로컬 데이터 올리기」를 눌러 처음 한 번 업로드해주세요.';
      return;
    }

    const map=new Map((state.trips||[]).map(t=>[t.id,t]));
    rows.forEach(r=>map.set(r.id,r.data));
    state.trips=[...map.values()].map(normalizeTrip);
    tpCloudApplyingRemote=true;
    tpCloudStoreLocalOnly();
    tpCloudApplyingRemote=false;

    if(!hadLocal || tpCloudIsMigrated() || rows.length){
      tpCloudReadyForAutoSync=true;
    }
    if(!tpCloudIsMigrated() && hadLocal && rows.length){
      const remoteIds=new Set(rows.map(r=>r.id));
      const localOnly=(state.trips||[]).filter(t=>!remoteIds.has(t.id)).length;
      if(localOnly){
        tpCloudReadyForAutoSync=false;
        tpCloudLastMessage=`Supabase 데이터를 불러왔어요. 로컬에만 있는 여행 ${localOnly}개가 있어 「로컬 데이터 올리기」가 필요합니다.`;
      }else{
        tpCloudMarkMigrated();
        tpCloudReadyForAutoSync=true;
        tpCloudLastMessage='Supabase 데이터를 불러왔어요.';
      }
    }else{
      tpCloudLastMessage=manual?'Supabase에서 최신 데이터를 불러왔어요.':'Supabase 연결 완료';
    }
    render();
  }catch(err){
    console.error('Supabase load failed',err);
    tpCloudLastError=err?.message||String(err);
    tpCloudLastMessage='Supabase 데이터를 불러오지 못했어요.';
  }finally{
    tpCloudSyncing=false;tpCloudUpdateButton();
    if(document.getElementById('cloudBack')?.classList.contains('show'))tpCloudRenderModal();
  }
}
function tpCloudApplyRemoteRow(row){
  if(!row?.id||!row?.data)return;
  const incoming=row.data;normalizeTrip(incoming);
  const snap=tpCloudJson(tpCloudSafeTrip(incoming));
  if(tpCloudBaseline.get(row.id)===snap)return;
  tpCloudBaseline.set(row.id,snap);
  tpCloudMeta.set(row.id,{owner_id:row.owner_id,updated_at:row.updated_at,name:row.name});
  const idx=(state.trips||[]).findIndex(t=>t.id===row.id);
  if(idx>=0)state.trips[idx]=incoming;else state.trips.push(incoming);
  tpCloudApplyingRemote=true;tpCloudStoreLocalOnly();tpCloudApplyingRemote=false;
  render();
  toast('공유 여행이 업데이트됐어요');
}
function tpCloudSetupRealtime(){
  if(!tpSb||!tpCloudSession)return;
  if(tpCloudRealtime){tpSb.removeChannel(tpCloudRealtime);tpCloudRealtime=null}
  tpCloudRealtime=tpSb.channel('trip-pocket-shared-trips')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'trips'},payload=>tpCloudApplyRemoteRow(payload.new))
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'trips'},payload=>tpCloudApplyRemoteRow(payload.new))
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'trips'},payload=>{
      const id=payload.old?.id;if(!id)return;
      state.trips=(state.trips||[]).filter(t=>t.id!==id);
      tpCloudBaseline.delete(id);tpCloudMeta.delete(id);
      if(currentTripId===id)currentTripId=null;
      tpCloudApplyingRemote=true;tpCloudStoreLocalOnly();tpCloudApplyingRemote=false;render();
    }).subscribe();
}
async function tpCloudHandleSession(session){
  tpCloudSession=session||null;
  tpCloudLastError='';
  if(tpCloudSession){
    tpCloudUpdateButton();
    tpCloudSetupRealtime();
    await tpCloudLoadRemote();
  }else{
    tpCloudReadyForAutoSync=false;
    tpCloudBaseline.clear();tpCloudMeta.clear();
    if(tpCloudRealtime&&tpSb){tpSb.removeChannel(tpCloudRealtime);tpCloudRealtime=null}
    tpCloudLastMessage='로그인하면 여행을 Supabase에 저장하고 공유할 수 있어요.';
    tpCloudUpdateButton();
  }
  if(document.getElementById('cloudBack')?.classList.contains('show'))tpCloudRenderModal();
}
async function tpCloudSignIn(){

  const password=document.getElementById('cloudPassword')?.value||'';
  if(!email||!password)return alert('이메일과 비밀번호를 입력해주세요.');

}

  if(!email||!password)return alert('이메일과 비밀번호를 입력해주세요.');

  const {data,error}=await tpSb.auth.signUp({
    email,password,

  });
  if(error)return alert('회원가입 실패\n\n'+error.message);

  else alert('회원가입 요청을 보냈습니다.\n이메일 인증 후 로그인해주세요.');
}
async function tpCloudSignOut(){
  if(!confirm('Supabase에서 로그아웃할까요?\n브라우저의 로컬 데이터는 그대로 남습니다.'))return;

async function tpCloudRefreshMembers(){
  const tripId=document.getElementById('cloudShareTrip')?.value;
  const box=document.getElementById('cloudMemberList');
  if(!box||!tripId)return;
  box.innerHTML='<div class="cloud-note">멤버 목록을 불러오는 중…</div>';

    tpSb.from('trip_members').select('user_id,email,added_at').eq('trip_id',tripId).order('added_at',{ascending:true}),
    tpSb.from('trips').select('owner_id').eq('id',tripId).single()
  ]);
  if(error||tripErr){

  tpCloudMeta.set(tripId,{...(tpCloudMeta.get(tripId)||{}),owner_id:row.owner_id});

  const arr=members||[];
  box.innerHTML=arr.length?arr.map(m=>`<div class="cloud-member"><div class="cloud-member-email">${esc(m.email)}</div>${isOwner?`<button onclick="tpCloudRemoveMember('${esc(tripId)}','${esc(m.user_id)}')">삭제</button>`:''}</div>`).join(''):'<div class="cloud-note">아직 추가된 공유 멤버가 없습니다.</div>';

  if(!confirm('이 멤버의 여행 공유 권한을 삭제할까요?'))return;
  const {error}=await tpSb.rpc('remove_trip_member',{p_trip_id:tripId,p_user_id:userId});

function tpCloudRenderShareSection(){
  const trips=state.trips||[];
  if(!trips.length)return `<div class="cloud-card"><div class="cloud-card-title">여행 공유</div><div class="cloud-note">공유할 여행이 아직 없습니다.</div></div>`;
  const selected=(currentTripId&&trips.some(t=>t.id===currentTripId))?currentTripId:trips[0].id;
  setTimeout(()=>tpCloudRefreshMembers(),0);
  return `<div class="cloud-card"><div class="cloud-card-title">여행 공유</div>
    <div class="cloud-field"><label>공유할 여행</label><select id="cloudShareTrip" onchange="tpCloudRefreshMembers()">${trips.map(t=>`<option value="${esc(t.id)}" ${t.id===selected?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
    <div id="cloudAddMemberArea"><div class="cloud-grid"><div class="cloud-field" style="margin:0"><label>동행자 이메일</label><input id="cloudMemberEmail" type="email" placeholder="example@email.com"></div><button class="cloud-btn primary" style="align-self:end" onclick="tpCloudAddMember()">공유 추가</button></div><div class="cloud-note">동행자가 먼저 Trip Pocket에서 회원가입·이메일 인증을 완료해야 추가할 수 있어요.</div></div>
    <div class="cloud-members" id="cloudMemberList"><div class="cloud-note">멤버 목록을 불러오는 중…</div></div>
  </div>`;
}
function tpCloudRenderModal(){
  const body=document.getElementById('cloudModalBody');if(!body)return;
  const user=tpCloudCurrentUser();
  if(!user){
    body.innerHTML=`<div class="cloud-card"><div class="cloud-card-title">로그인 / 회원가입</div>
      <div class="cloud-field"><label>이메일</label><input type="email" id="cloudEmail" autocomplete="email" placeholder="이메일"></div>
      <div class="cloud-field"><label>비밀번호</label><input type="password" id="cloudPassword" autocomplete="current-password" placeholder="6자 이상"></div>
      <div class="cloud-grid"><button class="cloud-btn primary" id="cloudSignInBtn" onclick="tpCloudSignIn()">로그인</button><button class="cloud-btn" onclick="tpCloudSignUp()">회원가입</button></div>
      <div class="cloud-note">회원가입 후 이메일 인증이 필요한 경우 인증 메일의 링크를 누른 뒤 다시 로그인해주세요.</div></div>
      <div class="cloud-card"><div class="cloud-note">로그인하기 전에도 현재 브라우저의 로컬 데이터는 그대로 사용할 수 있습니다.</div></div>`;
    return;
  }
  const needsMigration=(state.trips||[]).length>0&&!tpCloudIsMigrated()&&!tpCloudReadyForAutoSync;
  body.innerHTML=`<div class="cloud-card">
    <div class="cloud-status-row"><div class="cloud-user"><b>${esc(user.email||'로그인됨')}</b><div class="small muted">${esc(tpCloudLastMessage)}</div></div><span class="cloud-badge ${tpCloudLastError?'warn':''}">${tpCloudSyncing?'동기화 중':tpCloudLastError?'확인 필요':'연결됨'}</span></div>
    ${tpCloudLastError?`<div class="cloud-alert error" style="margin-top:10px">${esc(tpCloudLastError)}</div>`:''}
    ${needsMigration?`<div class="cloud-alert" style="margin-top:10px">기존 로컬 여행 데이터가 있습니다. 처음 한 번 「로컬 데이터 올리기」를 실행해주세요.</div>`:''}
    <div class="cloud-grid" style="margin-top:10px"><button class="cloud-btn primary" onclick="tpCloudLoadRemote({manual:true})">최신 데이터 불러오기</button><button class="cloud-btn" onclick="tpCloudUploadAllLocal()">로컬 데이터 올리기</button></div>
    <div class="cloud-grid" style="margin-top:8px"><button class="cloud-btn gray" onclick="tpCloudSyncDirtyTrips()">지금 저장</button><button class="cloud-btn danger" onclick="tpCloudSignOut()">로그아웃</button></div>
    <div class="cloud-sync-log">Supabase 연결 후 변경사항은 자동 저장됩니다. JSON 백업 기능도 그대로 사용할 수 있어요.</div>
  </div>${tpCloudRenderShareSection()}`;
}
function tpOpenCloudModal(){
  document.getElementById('cloudBack')?.classList.add('show');
  tpCloudRenderModal();
}
function tpCloseCloudModal(){document.getElementById('cloudBack')?.classList.remove('show')}

async function tpCloudInit(){
  try{
    if(!window.supabase?.createClient)throw new Error('Supabase 라이브러리를 불러오지 못했습니다.');
    tpSb=window.supabase.createClient(TP_SUPABASE_URL,TP_SUPABASE_PUBLISHABLE_KEY,{
      auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
    });
    tpSb.auth.onAuthStateChange((event,session)=>{
      setTimeout(()=>tpCloudHandleSession(session),0);
    });
    const {data,error}=await tpSb.auth.getSession();
    if(error)throw error;
    await tpCloudHandleSession(data?.session||null);
  }catch(err){
    console.error('Supabase init failed',err);
    tpCloudLastError=err?.message||String(err);
    tpCloudLastMessage='Supabase 초기화 실패';
    tpCloudUpdateButton();
  }
}

document.getElementById('cloudBtn')?.addEventListener('click',tpOpenCloudModal);
document.getElementById('cloudCloseBtn')?.addEventListener('click',tpCloseCloudModal);
document.getElementById('cloudBack')?.addEventListener('click',e=>{if(e.target===e.currentTarget)tpCloseCloudModal()});
tpCloudInit();
</script>


<script>
/* ===== v31 auth screen + trip delete ===== */
let cloudAuthMode='signin';

function tpCloudSetAuthMode(mode){
  cloudAuthMode=mode==='signup'?'signup':'signin';
  tpCloudRenderModal();
}
function tpCloudTogglePassword(){
  const el=document.getElementById('cloudPassword');
  if(!el)return;
  el.type=el.type==='password'?'text':'password';
}
function tpCloudRenderAuthScreen(){
  const signup=cloudAuthMode==='signup';
  return `<div class="cloud-auth-hero">
    <div class="cloud-auth-icon">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7.4 18.2h9.1a4.1 4.1 0 0 0 .6-8.16A5.7 5.7 0 0 0 6.38 8.5 4.86 4.86 0 0 0 7.4 18.2Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="cloud-auth-title">같이 만드는 여행, 한 곳에</div>
    <div class="cloud-auth-copy">로그인하면 여행·일정·준비물·정산이 Supabase에 저장되고<br>공유한 사람과 같은 여행을 함께 사용할 수 있어요.</div>
  </div>
  <div class="cloud-auth-tabs">
    <button class="cloud-auth-tab ${!signup?'active':''}" onclick="tpCloudSetAuthMode('signin')">로그인</button>
    <button class="cloud-auth-tab ${signup?'active':''}" onclick="tpCloudSetAuthMode('signup')">처음이에요</button>
  </div>
  <div class="cloud-auth-form">
    <div class="cloud-field"><label>이메일</label><input type="email" id="cloudEmail" autocomplete="email" placeholder="name@example.com"></div>
    <div class="cloud-field"><label>비밀번호</label><input type="password" id="cloudPassword" autocomplete="${signup?'new-password':'current-password'}" placeholder="${signup?'6자 이상으로 만들어주세요':'비밀번호를 입력해주세요'}"></div>
    <button class="cloud-auth-main" id="cloudSignInBtn" onclick="${signup?'tpCloudSignUp()':'tpCloudSignIn()'}">${signup?'Trip Pocket 시작하기':'로그인'}</button>
    <div class="cloud-auth-switch">${signup?'이미 계정이 있으신가요?':'처음 사용하시나요?'} <button onclick="tpCloudSetAuthMode('${signup?'signin':'signup'}')">${signup?'로그인':'계정 만들기'}</button></div>
    <div class="cloud-auth-foot">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3 5.5 5.5v5.4c0 4.2 2.8 8.1 6.5 9.1 3.7-1 6.5-4.9 6.5-9.1V5.5L12 3Z" stroke="currentColor" stroke-width="1.7"/></svg>
      <div>로그인 전에도 이 브라우저의 기존 여행 데이터는 그대로 남아 있습니다. 로그인 후 처음 한 번만 ‘로컬 데이터 올리기’를 실행하면 됩니다.</div>
    </div>
  </div>`;
}

const tpCloudRenderModalV30=tpCloudRenderModal;
tpCloudRenderModal=function(){
  const body=document.getElementById('cloudModalBody');if(!body)return;
  const user=tpCloudCurrentUser();
  if(!user){
    const sub=document.getElementById('cloudModalSub');
    if(sub)sub.textContent='내 여행을 안전하게 저장하고 함께 써보세요.';
    body.innerHTML=tpCloudRenderAuthScreen();
    return;
  }
  const sub=document.getElementById('cloudModalSub');
  if(sub)sub.textContent='공유 저장소 연결 상태와 여행 공유를 관리할 수 있어요.';
  tpCloudRenderModalV30();
};

async function tpDeleteTrip(id,event){
  if(event){event.preventDefault();event.stopPropagation()}
  const t=(state.trips||[]).find(x=>x.id===id);
  if(!t)return;

  let remoteRow=null;
  if(tpCloudSession && tpSb){
    try{
      const {data,error}=await tpSb.from('trips').select('id,owner_id').eq('id',id).maybeSingle();
      if(error)throw error;
      remoteRow=data||null;
    }catch(err){
      const proceed=confirm(`Supabase 연결 상태를 확인하지 못했습니다.\n\n${err?.message||err}\n\n로컬에서만 여행을 삭제할까요?`);
      if(!proceed)return;
    }
  }

  if(remoteRow && remoteRow.owner_id!==tpCloudSession?.user?.id){
    alert('공유받은 여행은 소유자만 삭제할 수 있어요.\n여행 소유자에게 삭제를 요청해주세요.');
    return;
  }

  const cloudText=remoteRow?'Supabase 공유 저장소에서도 함께 삭제됩니다.':'현재 브라우저에서 삭제됩니다.';
  const ok=confirm(`「${t.name}」 여행을 삭제할까요?\n\n일정, 가고 싶은 곳, 준비물, 정산 등 여행 안의 모든 내용이 삭제됩니다.\n${cloudText}\n\n이 작업은 되돌릴 수 없습니다.`);
  if(!ok)return;

  if(remoteRow && tpSb){
    const {data,error}=await tpSb.from('trips').delete().eq('id',id).select('id');
    if(error){
      alert('Supabase에서 여행을 삭제하지 못했습니다.\n\n'+error.message);
      return;
    }
    if(!data?.length){
      alert('여행 삭제 권한이 없거나 이미 삭제된 여행입니다.');
      return;
    }
  }

  tpCloudApplyingRemote=true;
  state.trips=(state.trips||[]).filter(x=>x.id!==id);
  if(currentTripId===id)currentTripId=null;
  tpCloudBaseline.delete(id);
  tpCloudMeta.delete(id);
  localStorage.setItem(KEY,JSON.stringify(state));
  tpCloudApplyingRemote=false;
  render();
  toast('여행을 삭제했어요');
}

function tripCard(t){
  return `<article class="card trip-card" onclick="openTrip('${t.id}')">
    <button class="trip-delete-btn" type="button" onclick="tpDeleteTrip('${t.id}',event)" aria-label="여행 삭제" title="여행 삭제">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.5 7h15M9.5 4.5h5M8 10.5v6M12 10.5v6M16 10.5v6M6.5 7l.8 12h9.4l.8-12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="trip-cover"><div class="small" style="opacity:.82">${esc(t.start)} — ${esc(t.end)}</div><div class="trip-dest">${esc(t.destination)}</div></div>
    <div class="trip-body"><div class="row between"><div><b>${esc(t.name)}</b><div class="small muted" style="margin-top:5px">${fmt(t.start)} → ${fmt(t.end)}</div></div><div>›</div></div><div class="meta"><span class="pill">${nights(t.start,t.end)}박 ${tripDays(t.start,t.end)}일</span><span class="pill">가고 싶은 곳 ${(t.pool||[]).length}</span><span class="pill">일정 ${(t.plans||[]).length}</span></div></div>
  </article>`;
}
</script>
