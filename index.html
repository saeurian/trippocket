<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#edf5ff">
<title>Trip Pocket Cloud v32</title>
<style>
:root{
  --bg:#f5f9ff;--card:#fff;--ink:#14243b;--muted:#718197;--line:#dce9f8;
  --blue:#2368d8;--blue2:#5a9cf2;--blue3:#dfeeff;--blue4:#eff6ff;--navy:#183b69;
  --green:#317a56;--greenbg:#eaf7f0;--warn:#a26b24;--warnbg:#fff6e8;--danger:#b94d4d;
  --shadow:0 12px 34px rgba(40,88,145,.09);--r:22px;
}
*{box-sizing:border-box}
html,body{margin:0;background:linear-gradient(180deg,#eef6ff 0,#f9fbff 38%,#f5f9ff 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Segoe UI",sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit}
.app{max-width:580px;margin:0 auto;min-height:100vh;padding:0 16px 104px}
.topbar{position:sticky;top:0;z-index:40;background:rgba(245,249,255,.88);backdrop-filter:blur(18px);padding:14px 0 10px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:20px;font-weight:900;letter-spacing:-.045em;color:var(--navy)}
.iconbtn{border:1px solid #d6e6fa;background:white;width:42px;height:42px;border-radius:14px;box-shadow:var(--shadow)}
.hero{padding:22px 4px 18px}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--blue);font-weight:900}
h1{margin:7px 0 8px;font-size:32px;line-height:1.12;letter-spacing:-.055em}
.hero p{margin:0;color:var(--muted);line-height:1.6;font-size:14px}
.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:17px;margin-bottom:13px}
.trip-card{padding:0;overflow:hidden}
.trip-cover{height:132px;background:radial-gradient(circle at 80% 0%,rgba(255,255,255,.38),transparent 32%),linear-gradient(135deg,#3176de,#68adff);padding:20px;display:flex;flex-direction:column;justify-content:space-between;color:#fff}
.trip-dest{font-size:28px;font-weight:900;letter-spacing:-.055em}
.trip-body{padding:17px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:12px}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.pill,.badge{display:inline-flex;align-items:center;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:850}
.pill{background:var(--blue4);border:1px solid #d8eaff;color:#426487}
.badge{padding:5px 8px;background:#e8f2ff;color:#386898}
.badge.res{background:#f3eefe;color:#6e4ea1}
.badge.pool{background:#eaf7f0;color:#317a56}
.primary,.secondary,.ghost,.danger{border:0;border-radius:14px;padding:12px 14px;font-weight:850}
.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;box-shadow:0 8px 18px rgba(35,104,216,.2)}
.secondary{background:var(--blue3);color:var(--navy)}
.ghost{background:#edf4fc;color:var(--ink)}
.danger{background:#fdeaea;color:var(--danger)}
.full{width:100%}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;width:min(calc(100% - 32px),548px);z-index:30}
.empty{text-align:center;padding:34px 18px;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:8px}
label{display:block;font-size:13px;font-weight:850;margin:0 0 7px}
.field{margin-bottom:14px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:14px;background:white;padding:13px 14px;color:var(--ink);outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:#82b2ef;box-shadow:0 0 0 3px rgba(79,143,240,.14)}
textarea{min-height:86px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-actions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}
.form-actions>*{flex:1}
.sheetback{position:fixed;inset:0;background:rgba(16,36,64,.30);z-index:70;display:none;align-items:flex-end;justify-content:center}
.sheetback.open{display:flex}
.sheet{background:var(--bg);width:min(100%,580px);max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:12px 16px calc(24px + env(safe-area-inset-bottom));animation:up .2s ease}
@keyframes up{from{transform:translateY(35px);opacity:.4}to{transform:none;opacity:1}}
.handle{width:42px;height:5px;background:#c3d4e9;border-radius:999px;margin:3px auto 16px}
.sheet h2{font-size:23px;letter-spacing:-.04em;margin:0 0 18px}
.triphead{padding:10px 0 8px}
.back{border:0;background:none;padding:8px 4px;font-size:15px;font-weight:850;color:var(--navy)}
.triptitle{font-size:30px;font-weight:900;letter-spacing:-.055em;margin:11px 0 6px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;position:sticky;top:66px;z-index:22;background:rgba(245,249,255,.96);padding:8px 0 13px;backdrop-filter:blur(12px)}
.tab{border:0;background:#e7f0fb;border-radius:13px;padding:10px 3px;font-size:11px;font-weight:850;color:#6d8096}
.tab.active{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 7px 16px rgba(35,104,216,.18)}
.section-title{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:18px 2px 10px}
.section-title h3{margin:0;font-size:20px;letter-spacing:-.035em}
.addmini{border:0;background:var(--blue3);color:var(--navy);border-radius:11px;padding:8px 10px;font-size:12px;font-weight:850}
.item{background:white;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.item h4{margin:0 0 5px;font-size:16px;letter-spacing:-.025em}
.itemline{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.45}
.actions{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.actions a,.actions button{flex:1;min-width:90px;text-align:center;text-decoration:none;border:0;background:#edf5ff;color:var(--navy);border-radius:11px;padding:9px;font-size:12px;font-weight:850}
.api-note,.info-note,.warn-note{padding:12px 13px;border-radius:14px;font-size:12px;line-height:1.55;margin-bottom:14px}
.api-note,.info-note{background:#eef6ff;border:1px solid #d2e7ff}
.warn-note{background:var(--warnbg);border:1px solid #f2ddb8;color:#7d5925}
.inline-note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:7px}
.home-hero{background:radial-gradient(circle at 80% 15%,rgba(255,255,255,.35),transparent 28%),linear-gradient(135deg,#2468d6,#58a2ff);color:white;border:none}
.home-hero .muted{color:rgba(255,255,255,.82)}
.home-date{font-size:12px;font-weight:850;letter-spacing:.06em}
.home-main{font-size:25px;font-weight:900;letter-spacing:-.045em;margin-top:6px}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini-card{background:white;border:1px solid var(--line);border-radius:18px;padding:14px;min-height:112px}
.mini-card.clickable{cursor:pointer}
.mini-card .kicker{font-size:11px;color:var(--blue);font-weight:900;margin-bottom:6px}
.mini-card .main{font-size:15px;font-weight:900;line-height:1.35}
.mini-card .sub{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.45}
.pool-top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pool-card{position:relative}
.pool-card .pool-title{font-weight:900;font-size:16px}
.pool-card .pool-meta{font-size:12px;color:var(--muted);margin-top:5px}
.cluster{border:1px solid #cfe2fa;background:#fbfdff;border-radius:20px;padding:14px;margin-bottom:13px}
.cluster-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
.cluster-name{font-size:17px;font-weight:900}
.cluster-sub{font-size:12px;color:var(--muted);margin-top:4px}
.cluster-place{background:white;border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:8px}
.cluster-place.dragging{opacity:.45}
.cluster.dropzone{outline:2px dashed #79aef0;outline-offset:2px}
.cluster-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.cluster-actions button{border:0;border-radius:11px;padding:9px 10px;font-size:12px;font-weight:850;background:#eaf3ff;color:var(--navy)}
.dayblock{margin:17px 0}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.daytitle{font-size:15px;font-weight:900}
.daytag{font-size:11px;font-weight:900;color:var(--blue);background:#e9f3ff;padding:5px 8px;border-radius:999px}
.timeline{border-left:2px solid #c8dcf5;margin-left:58px;padding-left:16px}
.plan-row{position:relative}
.time-label{position:absolute;left:-75px;top:15px;width:51px;text-align:right;font-size:12px;font-weight:900;color:var(--navy);line-height:1.25}
.plan-card{position:relative;background:white;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.plan-card:before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--blue);left:-22px;top:18px;border:3px solid var(--bg)}
.drag-handle{font-size:19px;color:#8ba1ba;user-select:none;touch-action:none;padding:4px}
.plan-card.dragging{opacity:.45}
.plan-card.drop-before{border-top:3px solid var(--blue)}
.hours{margin-top:9px;padding:10px 11px;background:#f0f7ff;border-radius:12px;font-size:12px;line-height:1.55}
.memo{margin-top:9px;padding:10px 11px;background:#f7f9fc;border-radius:12px;font-size:12px;line-height:1.5;color:#536479}
.time-ui{border:1px solid var(--line);background:white;border-radius:16px;padding:12px}
.ampm{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.ampm button{border:0;border-radius:11px;padding:10px;background:#edf4fc;color:#6b7c91;font-weight:900}
.ampm button.active{background:var(--blue);color:white}
.time-selects{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.time-selects select{margin:0}
.checkline{display:flex;align-items:center;gap:9px;margin-top:10px;font-size:13px;font-weight:750}
.checkline input{width:18px;height:18px;margin:0}
.candidate{background:white;border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:9px;width:100%;text-align:left}
.candidate-title{font-weight:900}
.candidate-meta{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.4}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:#173a6a;color:white;padding:11px 15px;border-radius:999px;font-size:13px;font-weight:800;z-index:100;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1}
@media(max-width:390px){.tabs{grid-template-columns:repeat(5,1fr)}.tab{font-size:10px}.home-grid{grid-template-columns:1fr}.timeline{margin-left:52px}.time-label{left:-70px}}
@media(min-width:581px){.sheet{margin-bottom:14px;border-radius:28px}.sheetback{align-items:center}.fab{bottom:28px}}

.pool-summary{font-size:12px;color:var(--muted);margin:-2px 2px 14px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.pool-summary b{color:var(--navy)}
.view-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.view-tab{border:0;border-radius:15px;padding:12px 8px;background:#edf4fc;color:var(--ink);font-weight:900}
.view-tab.active{background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;box-shadow:0 7px 16px rgba(35,104,216,.18)}
.subhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 10px}
.subhead-title{font-size:13px;font-weight:900;color:var(--navy)}
.mode-toggle{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.mode-btn{border:1px solid var(--line);border-radius:13px;padding:10px;background:white;color:var(--muted);font-size:12px;font-weight:900}
.mode-btn.active{background:#e3efff;border-color:#bbd7fa;color:var(--navy)}
.filter-wrap{margin:2px 0 13px}
.filter-label{font-size:12px;color:var(--muted);font-weight:850;margin:0 2px 8px}
.filter-chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
.filter-chips::-webkit-scrollbar{display:none}
.filter-chip{white-space:nowrap;border:1px solid var(--line);background:white;color:#64778e;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:850}
.filter-chip.active{background:#e5f0ff;color:var(--navy);border-color:#b8d6fb}
.group-status{background:#f6f9fd;border:1px solid var(--line);border-radius:14px;padding:10px 11px;margin-bottom:12px;font-size:11px;color:var(--muted);line-height:1.5}
.group-status .row{justify-content:space-between}
.refresh-mini{border:0;background:transparent;color:var(--blue);font-size:11px;font-weight:900;padding:4px 0}
.smart-note{font-size:11px;color:var(--muted);line-height:1.5;margin:7px 2px 12px}


.smart-debug{border:1px solid #d5e2f2;border-radius:14px;background:#fbfdff;padding:11px 12px;margin:9px 0 12px}
.smart-debug-title{font-size:12px;font-weight:900;color:var(--navy);margin-bottom:7px}
.smart-debug-line{font-size:11px;color:var(--muted);line-height:1.55;display:flex;gap:7px;align-items:flex-start}
.smart-debug-line b{color:var(--ink);font-weight:850}
.smart-debug-line.ok{color:#2c7a54}
.smart-debug-line.err{color:#b42318}
.smart-debug-line.run{color:#2368d8}
.smart-error{margin-top:8px;padding:9px 10px;border-radius:11px;background:#fff2f0;border:1px solid #ffd0ca;color:#9b1c12;font-size:11px;line-height:1.55;word-break:break-word}
.smart-progress{height:6px;background:#e8eef7;border-radius:999px;overflow:hidden;margin:8px 0 5px}
.smart-progress>i{display:block;height:100%;background:#5795ec;width:0%;transition:width .2s ease}


.map-toolbar{display:flex;justify-content:flex-end;margin:0 0 12px}
.map-view-btn{border:0;background:#e5f0ff;color:var(--navy);border-radius:12px;padding:9px 12px;font-size:12px;font-weight:900}
.mapback{position:fixed;inset:0;background:rgba(12,28,49,.55);z-index:160;display:none;align-items:stretch;justify-content:center;padding:0}
.mapback.show{display:flex}
.mapmodal{width:min(100%,760px);height:100%;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.maphead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 17px 12px;background:white;border-bottom:1px solid var(--line)}
.maphead-title{font-size:17px;font-weight:900;letter-spacing:-.03em}
.maphead-sub{font-size:11px;color:var(--muted);margin-top:3px}
.mapclose{border:0;background:#edf4fc;color:var(--navy);border-radius:999px;width:34px;height:34px;font-size:18px;font-weight:900}
#groupMap{flex:1;min-height:360px;background:#dfe9f5}
.maplegend{background:white;border-top:1px solid var(--line);padding:10px 13px 14px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.maplegend::-webkit-scrollbar{display:none}
.legend-chip{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:850;display:flex;align-items:center;gap:6px}
.legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.map-loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;background:white;padding:12px 15px;border-radius:13px;box-shadow:0 7px 24px rgba(26,56,92,.15);font-size:12px;font-weight:850;color:var(--navy)}
.mapbody{position:relative;flex:1;display:flex;min-height:0}
@media(min-width:761px){.mapback{padding:18px}.mapmodal{height:calc(100% - 36px);border-radius:26px}}


.share-panel{margin:0 0 14px;border:1px solid var(--line);background:white;border-radius:16px;padding:12px}
.share-title{font-size:13px;font-weight:900;color:var(--navy);margin-bottom:5px}
.share-desc{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:10px}
.share-actions{display:flex;gap:8px;flex-wrap:wrap}
.share-btn{border:0;border-radius:12px;padding:9px 12px;font-size:12px;font-weight:900;background:#e9f2ff;color:var(--navy)}
.share-btn.secondary{background:#f1f4f8;color:var(--ink)}
.import-status{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.45}


.header-actions{display:flex;align-items:center;gap:8px}
.backup-top-btn{border:0;background:#eef4fb;color:var(--navy);border-radius:12px;padding:9px 11px;font-size:11px;font-weight:900;white-space:nowrap}
.iconbtn.settings-large{width:44px;height:44px;font-size:25px;line-height:1;display:flex;align-items:center;justify-content:center}
.backup-back{position:fixed;inset:0;background:rgba(12,28,49,.48);z-index:180;display:none;align-items:center;justify-content:center;padding:20px}
.backup-back.show{display:flex}
.backup-modal{width:min(100%,430px);background:white;border-radius:22px;padding:18px;box-shadow:0 18px 50px rgba(20,40,70,.22)}
.backup-modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.backup-modal-title{font-size:18px;font-weight:900;color:var(--navy)}
.backup-modal-desc{font-size:12px;color:var(--muted);line-height:1.55;margin:4px 0 15px}
.backup-modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.backup-action{border:0;border-radius:14px;padding:13px 12px;font-size:13px;font-weight:900;background:#e8f2ff;color:var(--navy)}
.backup-action.secondary{background:#f1f4f8;color:var(--ink)}
.backup-close{border:0;background:#eef3f8;color:var(--navy);border-radius:999px;width:34px;height:34px;font-size:20px;font-weight:900}
.backup-foot{margin-top:12px;font-size:10px;color:var(--muted);line-height:1.5}


/* v14 top action polish */
.header-actions{display:flex;align-items:center;gap:8px;height:40px}
.backup-top-btn{
  height:40px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid #d7e5f6;background:#fff;color:var(--navy);
  border-radius:13px;padding:0 13px;font-size:12px;font-weight:900;
  line-height:1;box-shadow:0 3px 10px rgba(31,75,126,.06);
  cursor:pointer;-webkit-tap-highlight-color:transparent
}
.backup-top-btn:active{transform:translateY(1px);background:#f3f7fc}
.iconbtn.settings-large{
  width:40px!important;height:40px!important;min-width:40px!important;
  padding:0!important;margin:0!important;border-radius:13px!important;
  display:inline-flex!important;align-items:center!important;justify-content:center!important;
  line-height:0!important;vertical-align:middle!important;cursor:pointer;
  border:1px solid #d7e5f6!important;background:#fff!important;
  box-shadow:0 3px 10px rgba(31,75,126,.06)!important
}
.iconbtn.settings-large svg{width:21px;height:21px;display:block;stroke:var(--navy)}
.iconbtn.settings-large:active{transform:translateY(1px);background:#f3f7fc!important}
.topbar{align-items:center!important}


/* v15 settings icon */
.iconbtn.settings-large{overflow:visible!important;color:var(--navy)!important}
.iconbtn.settings-large svg{width:22px!important;height:22px!important;display:block!important;overflow:visible!important;stroke:currentColor!important}


/* ===== v20 packing / checklist / expense ===== */
.triphead2{background:linear-gradient(180deg,#ffffff,#f7fbff);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:24px;padding:16px 16px 14px;margin:10px 0 14px}
.triphead2-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.backbtn2{border:0;background:#eef4fb;color:var(--navy);border-radius:14px;padding:10px 12px;font-weight:900}
.trip-meta2 h2{margin:0;font-size:22px;color:var(--navy);line-height:1.2}
.trip-meta2 .meta{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
.tab-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 14px}
.tab-grid .tab{padding:10px 0;border-radius:14px;border:1px solid var(--line);background:#fff;font-weight:900;color:var(--navy)}
.tab-grid .tab.active{background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;border-color:transparent}
.section-card{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:22px;padding:16px;margin:0 0 14px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.section-head h3{margin:0;font-size:18px;color:var(--navy)}
.section-head .actions{display:flex;gap:8px;flex-wrap:wrap}
.mini-btn,.ghost-mini,.line-btn{border:0;border-radius:12px;padding:9px 11px;font-size:12px;font-weight:900}
.mini-btn{background:#e8f2ff;color:var(--navy)}
.ghost-mini{background:#f3f6fa;color:var(--ink)}
.line-btn{background:#fff;color:var(--navy);border:1px solid var(--line)}

.balance-stack{display:grid;gap:4px;text-align:right}
.balance-positive{color:#2d9c67;font-size:12px;font-weight:900}
.balance-negative{color:#d95b62;font-size:12px;font-weight:900}
.balance-zero{color:var(--muted);font-size:12px;font-weight:900}
.transfer-list{display:grid;gap:8px;padding-top:10px}

.transfer-amt{font-size:13px;font-weight:900;color:var(--navy);margin-top:4px}

  .expense-settings-strip .exp-setting{grid-column:1/-1}

  .exp-currency-totals{justify-content:flex-start}
  .exp-list-toolbar{align-items:center}
  .settle-summary{grid-template-columns:repeat(3,minmax(0,1fr))}

/* ===== v24 expense layout refinement ===== */
.expense-settings-strip{display:grid;grid-template-columns:minmax(220px,1.35fr) auto auto;gap:10px;align-items:end;padding:14px 14px 12px;border:1px solid var(--line);border-radius:22px;background:#f8fbff;overflow:visible}
.exp-setting{display:grid;gap:6px;min-width:0}
.exp-setting label{font-size:12px;font-weight:900;color:var(--muted)}
.exp-setting select,.exp-setting input{width:100%;height:44px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:0 13px;color:var(--ink);font-size:14px;font-weight:800;min-width:0;box-sizing:border-box}
.exp-setting-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:2px}
.exp-setting-note{font-size:11px;color:var(--muted);line-height:1.45;margin-top:2px}
.exp-setting-btn{height:44px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--navy);font-size:12px;font-weight:900;white-space:nowrap}
.exp-total-area{overflow:visible}
.exp-total-main{gap:16px}
.exp-total-krw{font-size:30px;line-height:1.05;word-break:keep-all}
.exp-currency-totals{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;max-width:100%}
.exp-currency-total{max-width:100%;padding:9px 11px;border-radius:14px}

.exp-subtabs{margin-bottom:16px}
.exp-list-toolbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.exp-list-toolbar .filter-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;flex:1 1 420px}
.exp-add-btn{height:46px;padding:0 18px;border-radius:16px;flex:0 0 auto}
.exp-flat-list{border:1px solid var(--line);border-radius:20px;background:#fff;overflow:hidden}
.exp-flat-row{background:#fff;border-top:1px solid #edf2f8;overflow:visible}
.exp-flat-row:first-child{border-top:0}
.exp-flat-main{display:grid;grid-template-columns:36px minmax(0,1fr) minmax(270px,0.92fr);gap:12px;align-items:center;padding:14px 14px 14px 12px;cursor:pointer;overflow:visible}
.exp-list-info{min-width:0}
.exp-list-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.exp-list-tag{font-size:10px;font-weight:900;color:var(--navy)}
.exp-list-tag.day{color:var(--muted)}
.exp-list-merchant{font-size:18px;font-weight:900;color:var(--ink);line-height:1.25;word-break:keep-all}
.exp-list-date{font-size:12px;color:var(--muted);margin-top:4px}
.exp-money-pair{display:grid;grid-template-columns:1fr 1fr;border:1px solid #e8eef7;border-radius:16px;overflow:hidden;min-width:0;background:#fbfdff}
.exp-money-cell{padding:10px 12px;min-width:0}
.exp-money-cell + .exp-money-cell{border-left:1px solid #e8eef7}
.exp-money-label{font-size:10px;color:var(--muted);font-weight:900;line-height:1.2}
.exp-money-val{font-size:16px;font-weight:900;color:var(--ink);line-height:1.25;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp-money-cell.krw .exp-money-val{color:var(--navy)}
.exp-list-detail{padding:0 14px 14px 60px}
.exp-detail-panel{background:#f8fbff;border-radius:15px;padding:12px 13px}
.exp-detail-line{font-size:12px;color:var(--muted);line-height:1.6;word-break:keep-all}
.exp-detail-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.exp-detail-actions button{border:0;border-radius:11px;background:#eaf0f7;color:var(--ink);padding:8px 11px;font-size:11px;font-weight:900}
.settle-section{overflow:visible}
.member-settle-row{grid-template-columns:40px minmax(0,1fr) minmax(170px,auto);gap:12px;align-items:flex-start}
.balance-stack{display:grid;gap:6px;text-align:right;min-width:0}
.balance-positive,.balance-negative,.balance-zero{font-size:13px;font-weight:900;white-space:normal;word-break:keep-all;line-height:1.35}
.transfer-card{grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.transfer-flow{font-size:14px;line-height:1.35;word-break:keep-all}
.transfer-amt{font-size:14px;line-height:1.35}
@media(max-width:720px){
  .expense-settings-strip{grid-template-columns:1fr 1fr;}
  .expense-settings-strip .exp-setting{grid-column:1 / -1}
  .exp-setting-row{grid-template-columns:1fr 1fr auto}
  .exp-flat-main{grid-template-columns:34px minmax(0,1fr);}
  .exp-money-pair{grid-column:2;}
}
@media(max-width:520px){
  .exp-setting-row{grid-template-columns:1fr;}
  .exp-setting-btn{width:100%}
  .exp-flat-main{padding:13px 12px}
  .exp-money-pair{grid-template-columns:1fr 1fr;}
  .exp-money-cell{padding:9px 10px}
  .exp-money-val{font-size:14px}
  .exp-list-detail{padding:0 12px 12px 12px}
  .member-settle-row{grid-template-columns:34px minmax(0,1fr);}
  .balance-stack{grid-column:2;text-align:left;margin-top:4px}

/* ===== v25 trip-wide exchange-rate settings ===== */
.rate-manager-list{display:grid;gap:10px;margin-top:10px}
.rate-manager-row{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:end;border:1px solid var(--line);border-radius:16px;padding:11px;background:#fbfdff}
.rate-manager-row .field{margin:0}
.rate-manager-row .field label{font-size:11px}
.rate-unit-help{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.35}
.rate-remove{height:42px;border:0;border-radius:12px;background:#eef2f7;color:var(--ink);font-weight:900;padding:0 11px}
.rate-add-row{display:flex;justify-content:flex-start;margin-top:10px}
.rate-summary-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.rate-summary-chip{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;background:#eaf3ff;color:var(--navy);font-size:10px;font-weight:900}

/* ===== v26 rate mode correctness ===== */
.rate-provisional{display:inline-flex;align-items:center;padding:3px 7px;border-radius:999px;background:#fff3cf;color:#9b741c;font-size:9px;font-weight:900;margin-left:5px}
.rate-error-note{color:#c05a62;font-weight:800}


/* ===== v29 total summary box clipping fix ===== */
.exp-total-area{
  border:1px solid var(--line) !important;
  border-radius:24px !important;
  background:#fff !important;
  padding:18px 16px !important;
  margin:0 0 16px !important;
  overflow:visible !important;
  box-sizing:border-box;
}
.exp-total-main{
  display:grid !important;

}
.exp-total-main > div:first-child{min-width:0;}

}
.exp-total-rate{line-height:1.45;}
.exp-currency-totals{
  display:flex !important;
  justify-content:flex-end !important;

  flex-wrap:wrap !important;

}

  white-space:nowrap;
  box-sizing:border-box;
}
@media(max-width:720px){
  .exp-total-main{grid-template-columns:1fr !important;align-items:start !important;}
  .exp-currency-totals{justify-content:flex-start !important;}
}


/* ===== Supabase cloud sync v30 ===== */
.cloud-top-btn{
  position:relative;width:40px;height:40px;min-width:40px;padding:0;border:1px solid #d7e5f6;
  background:#fff;color:var(--navy);border-radius:13px;display:inline-flex;align-items:center;
  justify-content:center;box-shadow:0 3px 10px rgba(31,75,126,.06);cursor:pointer
}
.cloud-top-btn svg{width:21px;height:21px;display:block}
.cloud-status-dot{position:absolute;right:5px;bottom:5px;width:8px;height:8px;border-radius:50%;background:#b8c4d2;border:2px solid #fff}
.cloud-status-dot.online{background:#32b875}.cloud-status-dot.syncing{background:#f1b84b}.cloud-status-dot.error{background:#df5b63}
.cloud-back{position:fixed;inset:0;background:rgba(12,28,49,.50);z-index:190;display:none;align-items:center;justify-content:center;padding:18px}
.cloud-back.show{display:flex}
.cloud-modal{width:min(100%,500px);max-height:88vh;overflow:auto;background:#fff;border-radius:24px;padding:18px;box-shadow:0 20px 60px rgba(20,40,70,.24)}
.cloud-modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.cloud-modal-title{font-size:20px;font-weight:900;color:var(--navy)}
.cloud-modal-sub{font-size:11px;color:var(--muted);line-height:1.5;margin-top:4px}
.cloud-card{border:1px solid var(--line);border-radius:18px;background:#fbfdff;padding:14px;margin-bottom:10px}
.cloud-card:last-child{margin-bottom:0}
.cloud-card-title{font-size:14px;font-weight:900;color:var(--navy);margin-bottom:9px}
.cloud-status-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cloud-user{min-width:0}.cloud-user b{display:block;font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.cloud-user .small{margin-top:3px}
.cloud-badge{display:inline-flex;align-items:center;padding:6px 9px;border-radius:999px;background:#e7f6ee;color:#2d8a5e;font-size:10px;font-weight:900;white-space:nowrap}
.cloud-badge.off{background:#f0f3f7;color:#7c8b9d}.cloud-badge.warn{background:#fff2d6;color:#9d721d}
.cloud-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cloud-btn{border:0;border-radius:13px;padding:11px 12px;font-size:12px;font-weight:900;background:#e8f2ff;color:var(--navy);cursor:pointer}
.cloud-btn.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff}
.cloud-btn.gray{background:#f0f3f7;color:var(--ink)}
.cloud-btn.danger{background:#fdecec;color:#b34f55}
.cloud-btn:disabled{opacity:.5;cursor:not-allowed}
.cloud-field{margin-bottom:10px}.cloud-field:last-child{margin-bottom:0}
.cloud-field label{font-size:11px;color:var(--muted);margin-bottom:5px}
.cloud-field input,.cloud-field select{height:42px;border-radius:12px;font-size:13px}
.cloud-note{font-size:10px;color:var(--muted);line-height:1.55;margin-top:8px}
.cloud-alert{border-radius:13px;padding:10px 11px;background:#fff3d9;color:#89651f;font-size:11px;line-height:1.5;margin-bottom:10px}
.cloud-alert.good{background:#e7f6ee;color:#2d7d58}.cloud-alert.error{background:#fdeaea;color:#a94e54}
.cloud-members{display:grid;gap:6px;margin-top:10px}
.cloud-member{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;background:#fff;border:1px solid #e7eef7;border-radius:12px}
.cloud-member-email{font-size:12px;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cloud-member button{border:0;border-radius:9px;background:#fdecec;color:#ad5157;padding:6px 8px;font-size:10px;font-weight:900}
.cloud-sync-log{font-size:10px;color:var(--muted);line-height:1.5;margin-top:7px}
@media(max-width:520px){.cloud-grid{grid-template-columns:1fr}.backup-top-btn{padding:0 10px}.header-actions{gap:6px}}


/* ===== v31 app-like auth + trip delete ===== */
.cloud-auth-hero{

}

.cloud-auth-form{padding:2px 2px 0}

.cloud-auth-form .cloud-field label{font-size:11px;font-weight:900;color:var(--navy)}

.cloud-auth-switch{text-align:center;font-size:11px;color:var(--muted);margin-top:12px}

.cloud-auth-foot{
  display:flex;align-items:flex-start;gap:8px;margin-top:14px;padding:11px 12px;
  border-radius:14px;background:#f6f8fb;color:var(--muted);font-size:10px;line-height:1.5
}

.trip-card{position:relative}

}

<script>
const KEY='tripPocket_blue_cloud_v30';
const old=localStorage.getItem('tripPocket_blue_v28')||localStorage.getItem('tripPocket_blue_v27')||localStorage.getItem('tripPocket_blue_v26')||localStorage.getItem('tripPocket_blue_v25')||localStorage.getItem('tripPocket_blue_v24')||localStorage.getItem('tripPocket_blue_v23')||localStorage.getItem('tripPocket_blue_v21')||localStorage.getItem('tripPocket_blue_v20')||localStorage.getItem('tripPocket_blue_v19')||localStorage.getItem('tripPocket_blue_v18')||localStorage.getItem('tripPocket_blue_v17')||localStorage.getItem('tripPocket_blue_v16')||localStorage.getItem('tripPocket_blue_v15')||localStorage.getItem('tripPocket_blue_v14')||localStorage.getItem('tripPocket_blue_v13')||localStorage.getItem('tripPocket_blue_v12')||localStorage.getItem('tripPocket_blue_v11')||localStorage.getItem('tripPocket_blue_v10')||localStorage.getItem('tripPocket_blue_v9')||localStorage.getItem('tripPocket_blue_v8')||localStorage.getItem('tripPocket_blue_v7')||localStorage.getItem('tripPocket_blue_v6')||localStorage.getItem('tripPocket_blue_v5')||localStorage.getItem('tripPocket_blue_v4')||localStorage.getItem('tripPocket_blue_v3')||localStorage.getItem('tripPocket_v1');
let state=JSON.parse(localStorage.getItem(KEY)||old||'{"trips":[]}');
let currentTripId=null,currentTab='home',mapsLoading=false,pendingPlaceDraft=null,editingPlanId=null,editingPoolId=null,dragPlanId=null,dragPoolId=null,archiveMode=false,poolView='all',poolCategory='전체',groupViewMode='distance',archiveCountry='전체',archiveCity='전체',archiveCategory='전체';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function save(){
  localStorage.setItem(KEY,JSON.stringify(state));
  if(window.tpCloudQueueSync) window.tpCloudQueueSync();
}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('ko-KR',{month:'short',day:'numeric',weekday:'short'}):'';
const nights=(a,b)=>Math.max(0,Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000));
const tripDays=(a,b)=>nights(a,b)+1;
const mapsSearch=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
function trip(){return state.trips.find(x=>x.id===currentTripId)}
function normalizeTrip(t){
  t.flights=t.flights||[];t.hotels=t.hotels||[];t.plans=t.plans||[];t.pool=t.pool||[];
  t.distanceClusters=t.distanceClusters||[];
  t.smartClusters=t.smartClusters||[];
  t.smartRouteCache=t.smartRouteCache||{};
  t.smartPoolSignature=t.smartPoolSignature||'';
  if(t.smartPolicyVersion!==12){
    t.smartPolicyVersion=12;
    t.smartPoolSignature='';
    t.smartClusters=[];
  }
  t.smartDiag=t.smartDiag||{phase:'idle',message:'아직 계산하지 않았습니다.',error:'',done:0,total:0,walkDone:0,walkTotal:0,transitDone:0,transitTotal:0,updatedAt:0};
  if(!t.country||!t.city){
    const parts=String(t.destination||'').trim().split(/\s+/).filter(Boolean);
    if(!t.country)t.country=parts[0]||'';
    if(!t.city)t.city=parts.slice(1).join(' ')||'';
  }
  t.destination=[t.country,t.city].filter(Boolean).join(' ').trim()||t.destination||'';
  t.plans.forEach((p,i)=>{if(p.order==null)p.order=i;if(p.reserved==null)p.reserved=false});
  t.pool.forEach((p,i)=>{
    if(p.createdAt==null)p.createdAt=i+1;
    if(p.distanceClusterId==null)p.distanceClusterId=null;
    if(p.smartClusterId==null)p.smartClusterId=null;
  });
  return t
}
state.trips.forEach(t=>{normalizeTrip(t);buildDistanceGroupsBootstrap(t)});save();
function buildDistanceGroupsBootstrap(t){
  const pts=t.pool.filter(p=>p.lat!=null&&p.lng!=null),eps=1.5,visited=new Set(),groups=[];
  for(const p of pts){
    if(visited.has(p.id))continue;const group=[],queue=[p];visited.add(p.id);
    while(queue.length){const q=queue.shift();group.push(q);pts.forEach(x=>{if(!visited.has(x.id)&&distanceKmBootstrap(q.lat,q.lng,x.lat,x.lng)<=eps){visited.add(x.id);queue.push(x)}})}
    groups.push(group);
  }
  t.distanceClusters=groups.map((g,i)=>({id:t.distanceClusters?.[i]?.id||uid(),name:t.distanceClusters?.[i]?.name||`GROUP ${i+1}`,memberIds:g.map(p=>p.id),mode:'distance'}));
  const lookup=new Map();t.distanceClusters.forEach(c=>c.memberIds.forEach(id=>lookup.set(id,c.id)));t.pool.forEach(p=>p.distanceClusterId=lookup.get(p.id)||null);
}
function distanceKmBootstrap(a,b,c,d){const r=x=>x*Math.PI/180,R=6371,dp=r(c-a),dl=r(d-b),q=Math.sin(dp/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function openSheet(html){$('#sheetContent').innerHTML=html;$('#sheetBack').classList.add('open')}
function closeSheet(){$('#sheetBack').classList.remove('open');pendingPlaceDraft=null;editingPlanId=null;editingPoolId=null}
$('#sheetBack').addEventListener('click',e=>{if(e.target===e.currentTarget)closeSheet()});
$('#brandBtn').onclick=()=>{currentTripId=null;archiveMode=false;render()};
$('#settingsBtn').onclick=openSettings;
$('#backupBtn').onclick=openBackupModal;
$('#backupCloseBtn').onclick=closeBackupModal;
$('#backupExportBtn').onclick=()=>{exportTripPocketData();closeBackupModal()};
$('#backupImportBtn').onclick=()=>document.getElementById('tripImportInput').click();
$('#backupBack').addEventListener('click',e=>{if(e.target===e.currentTarget)closeBackupModal()});
function render(){if(archiveMode)return renderArchive();if(!currentTripId)renderTripList();else renderTrip()}
function renderTripList(){
  const visitedCount=getVisitedArchive().length;
  $('#view').innerHTML=`<section class="hero"><div class="eyebrow">MY TRAVEL PLANNER</div><h1>가고 싶은 곳부터<br>가볍게 모아보세요.</h1><p>장소를 먼저 쌓아두고, 위치별로 묶은 뒤 날짜를 통째로 배정할 수 있습니다.</p></section>
  <div class="card" style="cursor:pointer" onclick="openArchive()"><div class="row between"><div><div style="font-size:11px;color:var(--blue);font-weight:900">TRAVEL MEMORY</div><div style="font-size:19px;font-weight:900;margin-top:5px">내가 갔던 곳</div><div class="small muted" style="margin-top:5px">나라 · 도시 · 카테고리별로 다시 찾아보기</div></div><div style="font-size:24px">›</div></div><div class="meta"><span class="pill">저장된 방문 장소 ${visitedCount}</span></div></div>
  <section>${state.trips.length?state.trips.sort((a,b)=>a.start.localeCompare(b.start)).map(tripCard).join(''):`<div class="card empty"><div class="big">✈️</div><b>아직 등록한 여행이 없어요.</b><div class="small" style="margin-top:7px">첫 여행부터 만들어보세요.</div></div>`}</section>`;
  $('#fab').innerHTML=`<button class="primary full" onclick="openTripForm()">＋ 여행 등록</button>`;
}
function tripCard(t){return `<article class="card trip-card" onclick="openTrip('${t.id}')"><div class="trip-cover"><div class="small" style="opacity:.82">${esc(t.start)} — ${esc(t.end)}</div><div class="trip-dest">${esc(t.destination)}</div></div><div class="trip-body"><div class="row between"><div><b>${esc(t.name)}</b><div class="small muted" style="margin-top:5px">${fmt(t.start)} → ${fmt(t.end)}</div></div><div>›</div></div><div class="meta"><span class="pill">${nights(t.start,t.end)}박 ${tripDays(t.start,t.end)}일</span><span class="pill">가고 싶은 곳 ${(t.pool||[]).length}</span><span class="pill">일정 ${(t.plans||[]).length}</span></div></div></article>`}
function openTrip(id){currentTripId=id;archiveMode=false;currentTab='home';render()}
function openTripForm(){
  const countries=[...new Set(state.trips.map(t=>t.country).filter(Boolean))];
  const cities=[...new Set(state.trips.map(t=>t.city).filter(Boolean))];
  const countryOpts=[...new Set([...countries,'일본','대한민국','대만','태국','베트남','미국','프랑스','이탈리아','스페인','영국'])].map(x=>`<option value="${esc(x)}">`).join('');
  const cityOpts=[...new Set([...cities,'도쿄','오사카','교토','후쿠오카','삿포로','서울','부산','타이베이','방콕','파리','로마','런던'])].map(x=>`<option value="${esc(x)}">`).join('');
  openSheet(`<h2>새 여행 등록</h2><form id="tripForm"><div class="field"><label>여행명</label><input name="name" required placeholder="예: 겨울 도쿄 여행"></div><div class="grid2"><div class="field"><label>나라</label><input list="countryList" name="country" required placeholder="예: 일본"><datalist id="countryList">${countryOpts}</datalist></div><div class="field"><label>도시</label><input list="cityList" name="city" required placeholder="예: 도쿄"><datalist id="cityList">${cityOpts}</datalist></div></div><div class="grid2"><div class="field"><label>시작일</label><input type="date" name="start" required></div><div class="field"><label>종료일</label><input type="date" name="end" required></div></div><div class="field"><label>인원수</label><input type="number" min="1" value="1" name="people" required></div><div id="durationPreview" class="inline-note">날짜를 선택하면 몇 박 며칠인지 계산합니다.</div><div class="form-actions"><button type="button" class="ghost" onclick="closeSheet()">취소</button><button class="primary">여행 만들기</button></div></form>`);
  const f=$('#tripForm'),upd=()=>{if(f.start.value&&f.end.value){const n=nights(f.start.value,f.end.value);$('#durationPreview').textContent=n>=0?`${n}박 ${n+1}일 여행`:'종료일을 다시 확인해주세요.'}};
  f.start.onchange=upd;f.end.onchange=upd;
  f.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));if(d.end<d.start)return toast('종료일을 확인해주세요');const t=normalizeTrip({id:uid(),name:d.name,country:d.country.trim(),city:d.city.trim(),destination:[d.country.trim(),d.city.trim()].join(' '),start:d.start,end:d.end,people:+d.people,flights:[],hotels:[],plans:[],pool:[],clusters:[]});state.trips.push(t);save();closeSheet();currentTripId=t.id;archiveMode=false;currentTab='home';render();toast('여행을 만들었어요')};
}
function renderTrip(){
  const t=normalizeTrip(trip());if(!t){currentTripId=null;return render()}
  $('#view').innerHTML=`<section class="triphead"><button class="back" onclick="currentTripId=null;render()">‹ 모든 여행</button><div class="triptitle">${esc(t.name)}</div><div class="muted">${esc(t.destination)} · ${fmt(t.start)} ~ ${fmt(t.end)}</div><div class="meta"><span class="pill">${nights(t.start,t.end)}박 ${tripDays(t.start,t.end)}일</span><span class="pill">${t.people}명</span></div></section><nav class="tabs"><button class="tab ${currentTab==='home'?'active':''}" onclick="setTab('home')">홈</button><button class="tab ${currentTab==='pool'?'active':''}" onclick="setTab('pool')">가고싶은곳</button><button class="tab ${currentTab==='plan'?'active':''}" onclick="setTab('plan')">일정</button><button class="tab ${currentTab==='flight'?'active':''}" onclick="setTab('flight')">항공</button><button class="tab ${currentTab==='hotel'?'active':''}" onclick="setTab('hotel')">숙소</button></nav><section id="tabContent"></section>`;
  $('#fab').innerHTML='';renderTab();
}
function setTab(x){currentTab=x;renderTrip()}
function activeDay(){const t=trip(),now=todayISO();return(now>=t.start&&now<=t.end)?now:t.start}
function renderHome(){
  const t=trip(),d=activeDay(),isDuring=todayISO()>=t.start&&todayISO()<=t.end;
  const plans=plansForDate(d),flights=t.flights.slice().sort((a,b)=>(a.date+a.departTime).localeCompare(b.date+b.departTime));
  const rel=flights.filter(f=>f.date===d),shown=rel.length?rel:flights.slice(0,1);
  const hotel=t.hotels.find(h=>d>=h.checkin&&d<h.checkout)||t.hotels.slice().sort((a,b)=>a.checkin.localeCompare(b.checkin))[0];
  return `<div class="card home-hero"><div class="home-date">${isDuring?'TODAY':'FIRST DAY'} · ${fmt(d)}</div><div class="home-main">${isDuring?'오늘의 여행':'첫째 날 미리보기'}</div><div class="small muted" style="margin-top:7px">${isDuring?'오늘 필요한 정보만 모았습니다.':'여행 전이라 첫째 날 일정으로 보여드립니다.'}</div></div><div class="home-grid"><div class="mini-card clickable" onclick="setTab('flight')"><div class="kicker">FLIGHT</div>${shown.length?`<div class="main">${esc(shown[0].from)} → ${esc(shown[0].to)}</div><div class="sub">${fmt(shown[0].date)} · ${esc(shown[0].departTime)} 출발</div>`:`<div class="main">항공편 없음</div><div class="sub">항공 탭에서 추가하세요.</div>`}</div><div class="mini-card clickable" onclick="setTab('hotel')"><div class="kicker">STAY</div>${hotel?`<div class="main">${esc(hotel.name)}</div><div class="sub">${fmt(hotel.checkin)} → ${fmt(hotel.checkout)}</div>`:`<div class="main">숙소 없음</div><div class="sub">숙소 탭에서 추가하세요.</div>`}</div></div><div class="section-title"><h3>${isDuring?'오늘 일정':'첫째 날 일정'}</h3><button class="addmini" onclick="setTab('plan')">전체 보기</button></div>${plans.length?plans.map(p=>`<div class="item" onclick="openPlanForm('${p.id}')"><div class="row between"><div><div class="small" style="color:var(--blue);font-weight:900">${displayTime(p.time)}</div><h4 style="margin-top:4px">${esc(p.placeName)}</h4><div class="small muted">${esc(p.category)}${p.reserved?' · 예약':''}</div></div><div>›</div></div></div>`).join(''):`<div class="card empty">이 날에 등록된 일정이 없습니다.</div>`}`;
}
function renderTab(){
  const t=trip(),c=$('#tabContent');
  if(currentTab==='home'){c.innerHTML=renderHome();return}
  if(currentTab==='pool'){c.innerHTML=renderPool();bindClusterDrag();return}
  if(currentTab==='plan'){c.innerHTML=renderPlans();bindPlanDrag();return}
  if(currentTab==='flight'){c.innerHTML=`<div class="section-title"><h3>항공편</h3><button class="addmini" onclick="openFlightForm()">＋ 추가</button></div>${t.flights.length?t.flights.map(f=>`<div class="item"><h4>${esc(f.from)} → ${esc(f.to)}</h4><div class="itemline">${fmt(f.date)} · ${esc(f.departTime)} 출발 → ${esc(f.arriveTime)} 도착</div><div class="itemline">${esc(f.airline||'')} ${esc(f.flightNo||'')}</div><div class="actions"><button onclick="deleteItem('flights','${f.id}')">삭제</button></div></div>`).join(''):`<div class="card empty">등록한 항공편이 없습니다.</div>`}`;return}
  if(currentTab==='hotel'){c.innerHTML=`<div class="section-title"><h3>숙소</h3><button class="addmini" onclick="openHotelForm()">＋ 추가</button></div>${t.hotels.length?t.hotels.map(h=>`<div class="item"><h4>${esc(h.name)}</h4><div class="itemline">${fmt(h.checkin)} → ${fmt(h.checkout)} · ${nights(h.checkin,h.checkout)}박</div>${h.address?`<div class="itemline">${esc(h.address)}</div>`:''}<div class="actions"><a target="_blank" href="${esc(h.mapsUrl||mapsSearch(h.name+' '+t.destination))}">Google 지도</a><button onclick="deleteItem('hotels','${h.id}')">삭제</button></div></div>`).join(''):`<div class="card empty">등록한 숙소가 없습니다.</div>`}`;return}
}
function renderPool(){
  const t=trip(),hasCoords=t.pool.filter(p=>p.lat!=null&&p.lng!=null).length;
  const cats=['전체',...new Set(t.pool.map(p=>p.category).filter(Boolean))];
  const viewTabs=`<div class="view-tabs"><button class="view-tab ${poolView==='all'?'active':''}" onclick="setPoolView('all')">전체</button><button class="view-tab ${poolView==='group'?'active':''}" onclick="setPoolView('group')">위치그룹</button><button class="view-tab ${poolView==='category'?'active':''}" onclick="setPoolView('category')">카테고리</button></div>`;
  let body='';
  if(poolView==='group'){
    body=renderGroupView();
  }else if(poolView==='category'){
    body=`<div class="filter-wrap"><div class="filter-label">카테고리 필터</div><div class="filter-chips">${cats.map(c=>`<button class="filter-chip ${poolCategory===c?'active':''}" onclick="setPoolCategory('${esc(c)}')">${esc(c)}</button>`).join('')}</div></div>`;
    const arr=t.pool.slice().sort((a,b)=>(a.createdAt??0)-(b.createdAt??0)).filter(p=>poolCategory==='전체'||p.category===poolCategory);
    body+=renderPoolCards(arr);
  }else{
    body=renderPoolCards(t.pool.slice().sort((a,b)=>(a.createdAt??0)-(b.createdAt??0)));
  }
  return `${!getApiKey()?`<div class="api-note"><b>Google Places 자동 검색이 꺼져 있습니다.</b><br>⚙︎에서 API 키를 넣으면 장소 선택과 스마트 이동시간 그룹이 정확해집니다.</div>`:''}<div class="section-title"><h3>가고 싶은 곳</h3><button class="addmini" onclick="openPoolForm()">＋ 장소 추가</button></div><div class="pool-summary"><span><b>${t.pool.length}곳</b> 등록</span><span>·</span><span>좌표 ${hasCoords}곳 확보</span></div>${viewTabs}${t.pool.length===0?`<div class="card empty">날짜와 시간은 정하지 말고<br>가고 싶은 장소부터 쌓아보세요.</div>`:body}`;
}
function setPoolView(v){poolView=v;renderTab();if(v==='group'&&groupViewMode==='smart')ensureSmartGroups(trip(),false,true)}
function setPoolCategory(c){poolCategory=c;renderTab()}
function setGroupViewMode(v){
  groupViewMode=v;renderTab();
  if(v==='smart')ensureSmartGroups(trip(),false,true);
}
function renderPoolCards(arr){return arr.map(p=>`<div class="item pool-card"><div class="row between"><div><div class="pool-title">${esc(p.placeName)}</div><div class="pool-meta">${esc(p.category)}${p.address?' · '+esc(p.address):''}</div></div></div>${p.memo?`<div class="memo">${esc(p.memo)}</div>`:''}<div class="actions"><a target="_blank" href="${esc(p.mapsUrl||mapsSearch(p.placeName+' '+trip().destination))}">Google 지도</a><button onclick="openPoolForm('${p.id}')">수정</button><button onclick="deletePool('${p.id}')">삭제</button></div></div>`).join('')}
function renderGroupView(){
  const t=trip(),smart=groupViewMode==='smart',clusters=smart?t.smartClusters:t.distanceClusters;
  const count=t.pool.filter(p=>p.lat!=null&&p.lng!=null).length;
  const sig=poolCoordSignature(t),smartReady=t.smartPoolSignature===sig&&clusters.length>0;
  let status='';
  if(smart){
    status=`<div class="group-status"><div class="row"><span>${smartReady?'스마트 그룹 계산 완료':'스마트 그룹 확인 필요'} · 좌표 ${count}곳</span><button class="refresh-mini" onclick="refreshSmartGroups(true)">↻ 전체 다시 계산</button></div></div>${renderSmartDiagnostics(t)}<div class="smart-note">대중교통 10분 이내 또는 도보 20분 이내를 같은 생활권 후보로 보고, 가까운 장소만 실제 이동시간을 확인합니다. 문제가 생기면 위 진단 영역에 Google 응답 오류가 표시됩니다.</div>`;
  }else{
    status=`<div class="group-status"><div class="row"><span>직선거리 약 1.5km 기준 · 자동 계산</span><button class="refresh-mini" onclick="refreshDistanceGroups()">↻ 다시 계산</button></div></div>`;
  }
  return `<div class="subhead"><div class="subhead-title">그룹 기준</div></div><div class="mode-toggle"><button class="mode-btn ${!smart?'active':''}" onclick="setGroupViewMode('distance')">단순 거리 기준</button><button class="mode-btn ${smart?'active':''}" onclick="setGroupViewMode('smart')">스마트 이동시간</button></div>${status}${clusters.length?`<div class="map-toolbar"><button class="map-view-btn" onclick="openGroupMap('${smart?'smart':'distance'}')">⌖ 전체 그룹 지도</button></div>${renderClusters(clusters,smart?'smart':'distance')}`:`<div class="card empty">${smart?(t.smartDiag?.phase==='error'?'계산이 중단되었습니다. 위 오류 내용을 확인해주세요.':'스마트 이동시간 그룹을 계산하고 있습니다.'):'좌표가 있는 장소가 2곳 이상이면 자동으로 묶입니다.'}</div>`}`;
}
function renderSmartDiagnostics(t){
  const d=t.smartDiag||{},phase=d.phase||'idle';
  const icon=s=>s==='ok'?'✓':s==='run'?'●':s==='err'?'!':'○';
  const cls=s=>s==='ok'?'ok':s==='run'?'run':s==='err'?'err':'';
  const lib=phase==='loading_maps'?'run':['walk','transit','grouping','done'].includes(phase)?'ok':phase==='error'?'err':'';
  const walk=phase==='walk'?'run':['transit','grouping','done'].includes(phase)?'ok':phase==='error'&&d.failedPhase==='walk'?'err':'';
  const transit=phase==='transit'?'run':['grouping','done'].includes(phase)?'ok':phase==='error'&&d.failedPhase==='transit'?'err':'';
  const grouping=phase==='grouping'?'run':phase==='done'?'ok':phase==='error'&&d.failedPhase==='grouping'?'err':'';
  const total=(d.total||0),done=(d.done||0),pct=total?Math.min(100,Math.round(done/total*100)):(phase==='done'?100:0);
  return `<div class="smart-debug">
    <div class="smart-debug-title">스마트 그룹 진단</div>
    <div class="smart-debug-line ${cls(lib)}"><span>${icon(lib)}</span><span><b>Routes 라이브러리</b> ${phase==='loading_maps'?'불러오는 중':' '}</span></div>
    <div class="smart-debug-line ${cls(walk)}"><span>${icon(walk)}</span><span><b>도보 계산</b> ${d.walkTotal?`${d.walkDone||0} / ${d.walkTotal}`:''}</span></div>
    <div class="smart-debug-line ${cls(transit)}"><span>${icon(transit)}</span><span><b>대중교통 계산</b> ${d.transitTotal?`${d.transitDone||0} / ${d.transitTotal}`:''}</span></div>
    <div class="smart-debug-line ${cls(grouping)}"><span>${icon(grouping)}</span><span><b>그룹 생성</b></span></div>
    <div class="smart-progress"><i style="width:${pct}%"></i></div>
    <div class="smart-debug-line"><span>상태</span><span>${esc(d.message||'대기 중')}</span></div>
    ${d.error?`<div class="smart-error"><b>${esc(d.errorName||'ERROR')}</b><br>${esc(d.error)}</div>`:''}
  </div>`;
}
function renderClusters(clusters,mode){

  return clusters.map((cl,idx)=>{
    const places=t.pool.filter(p=>p[idField]===cl.id);
    const subtitle=mode==='smart'?`${places.length}곳`:`${places.length}곳 · 직선거리 기준`;
    return `<section class="cluster" data-cluster="${cl.id}" data-mode="${mode}"><div class="cluster-head"><div><div class="cluster-name">${esc(cl.name||`GROUP ${idx+1}`)}</div><div class="cluster-sub">${subtitle}</div></div><button class="addmini" onclick="renameCluster('${cl.id}','${mode}')">이름</button></div>${places.map(p=>`<div class="cluster-place" draggable="true" data-pool="${p.id}"><div class="row between"><div><b>${esc(p.placeName)}</b><div class="small muted" style="margin-top:4px">${esc(p.category)}</div></div><span class="drag-handle">≡</span></div></div>`).join('')}<div class="cluster-actions"><button onclick="openGroupMap('${mode}','${cl.id}')">⌖ 지도에서 보기</button><button onclick="assignClusterDate('${cl.id}','${mode}')">날짜 통째 배정</button><button onclick="splitCluster('${cl.id}','${mode}')">새 그룹 만들기</button></div></section>`;
  }).join('');

function poolCoordSignature(t){
  return t.pool.filter(p=>p.lat!=null&&p.lng!=null).map(p=>`${p.id}:${Number(p.lat).toFixed(5)},${Number(p.lng).toFixed(5)}`).sort().join('|');
}
function makeClusterObjects(t,groups,mode){
  const old=mode==='smart'?t.smartClusters:t.distanceClusters;
  const used=new Set();
  return groups.map((members,i)=>{
    let best=null,bestScore=0;
    for(const cl of old){
      if(used.has(cl.id))continue;
      const oldSet=new Set(cl.memberIds||[]);
      const score=members.filter(p=>oldSet.has(p.id)).length;
      if(score>bestScore){bestScore=score;best=cl}
    }
    if(best)used.add(best.id);
    return {id:best?.id||uid(),name:best?.name||`GROUP ${i+1}`,memberIds:members.map(p=>p.id),mode};
  });
}
function buildDistanceGroups(t){
  const pts=t.pool.filter(p=>p.lat!=null&&p.lng!=null),eps=1.5,visited=new Set(),groups=[];
  for(const p of pts){
    if(visited.has(p.id))continue;
    const group=[],queue=[p];visited.add(p.id);
    while(queue.length){
      const q=queue.shift();group.push(q);
      pts.forEach(x=>{
        if(!visited.has(x.id)&&distanceKm(q.lat,q.lng,x.lat,x.lng)<=eps){visited.add(x.id);queue.push(x)}
      });
    }
    groups.push(group);
  }
  t.distanceClusters=makeClusterObjects(t,groups,'distance');
  const lookup=new Map();
  t.distanceClusters.forEach(c=>c.memberIds.forEach(id=>lookup.set(id,c.id)));
  t.pool.forEach(p=>p.distanceClusterId=lookup.get(p.id)||null);
}
function refreshDistanceGroups(){const t=trip();buildDistanceGroups(t);save();renderTab();toast('거리 그룹을 다시 계산했어요')}
function routePairKey(a,b){return [a.id,b.id].sort().join('~')}
function pairCoordSig(a,b){
  const arr=[a,b].sort((x,y)=>x.id.localeCompare(y.id));
  return arr.map(p=>`${p.id}:${Number(p.lat).toFixed(5)},${Number(p.lng).toFixed(5)}`).join('|');
}
function getCandidatePairs(t,k=6){
  const pts=t.pool.filter(p=>p.lat!=null&&p.lng!=null),map=new Map();
  pts.forEach(p=>{
    pts.filter(q=>q.id!==p.id).map(q=>({q,d:distanceKm(p.lat,p.lng,q.lat,q.lng)})).sort((a,b)=>a.d-b.d).slice(0,k).forEach(({q,d})=>{
      const key=routePairKey(p,q);if(!map.has(key))map.set(key,{a:p,b:q,straightKm:d});
    });
  });
  return [...map.values()];
}
function routeCacheEntry(t,pair){
  const key=routePairKey(pair.a,pair.b),sig=pairCoordSig(pair.a,pair.b),cur=t.smartRouteCache[key];
  if(!cur||cur.coordSig!==sig)t.smartRouteCache[key]={coordSig:sig,walkChecked:false,transitChecked:false,walkMin:null,transitMin:null,checkedAt:0};
  return t.smartRouteCache[key];
}
function getTransitReferenceDate(t){
  const now=new Date(),start=new Date((t.start||todayISO())+'T13:00:00');
  const diff=(start-now)/86400000;
  if(diff>=0&&diff<=99)return start;
  const d=new Date(now);d.setDate(d.getDate()+1);d.setHours(13,0,0,0);return d;
}
function updateSmartDiag(t,patch,rerender=true){
  t.smartDiag={...(t.smartDiag||{}),...patch,updatedAt:Date.now()};
  save();
  if(rerender&&currentTripId===t.id&&currentTab==='pool'&&poolView==='group'&&groupViewMode==='smart')renderTab();
}
function errorText(err){
  if(!err)return '알 수 없는 오류';
  const parts=[];
  if(err.name)parts.push(err.name);
  if(err.code)parts.push(String(err.code));
  if(err.status)parts.push(String(err.status));
  if(err.message)parts.push(err.message);
  try{
    if(err.details)parts.push(typeof err.details==='string'?err.details:JSON.stringify(err.details));
  }catch(e){}
  return [...new Set(parts.filter(Boolean))].join(' · ')||String(err);
}
async function computePairMode(t,pairs,mode){
  if(!pairs.length)return;
  const phase=mode==='walk'?'walk':'transit';
  const totalKey=mode==='walk'?'walkTotal':'transitTotal',doneKey=mode==='walk'?'walkDone':'transitDone';
  updateSmartDiag(t,{phase,message:mode==='walk'?'도보 이동시간 계산 중':'대중교통 이동시간 계산 중',[totalKey]:pairs.length,[doneKey]:0,error:'',errorName:'',failedPhase:''});
  let RouteMatrix;
  try{
    await loadMaps();
    const lib=await google.maps.importLibrary('routes');
    RouteMatrix=lib.RouteMatrix;
    if(!RouteMatrix||typeof RouteMatrix.computeRouteMatrix!=='function')throw new Error('RouteMatrix.computeRouteMatrix 를 사용할 수 없습니다. Routes API 또는 Maps JavaScript API 권한/버전을 확인해주세요.');
  }catch(err){
    updateSmartDiag(t,{phase:'error',failedPhase:'loading_maps',message:'Routes 라이브러리를 불러오지 못했습니다.',error:errorText(err),errorName:err?.name||'ROUTES_LIBRARY_ERROR'});
    throw err;
  }
  const byOrigin=new Map();
  pairs.forEach(pair=>{
    const a=pair.a,b=pair.b,key=a.id;
    if(!byOrigin.has(key))byOrigin.set(key,{origin:a,items:[]});
    byOrigin.get(key).items.push({pair,dest:b});
  });
  let completed=0;
  try{
    for(const {origin,items} of byOrigin.values()){
      for(let offset=0;offset<items.length;offset+=90){
        const chunk=items.slice(offset,offset+90),request={
          origins:[{lat:Number(origin.lat),lng:Number(origin.lng)}],
          destinations:chunk.map(x=>({lat:Number(x.dest.lat),lng:Number(x.dest.lng)})),
          travelMode:mode==='walk'?'WALKING':'TRANSIT',
          language:'ko',
          fields:['durationMillis','condition']
        };
        if(mode==='transit')request.departureTime=getTransitReferenceDate(t);
        const result=await RouteMatrix.computeRouteMatrix(request);
        const matrix=result?.matrix;
        if(!matrix)throw new Error('RouteMatrix 응답에 matrix 데이터가 없습니다.');
        const row=matrix?.rows?.[0];
        chunk.forEach((x,i)=>{
          const item=row?.items?.[i],entry=routeCacheEntry(t,x.pair);
          const exists=item?.condition==='ROUTE_EXISTS'||item?.durationMillis!=null;
          const mins=exists&&Number.isFinite(item?.durationMillis)?Math.round(item.durationMillis/60000):null;
          if(mode==='walk'){entry.walkChecked=true;entry.walkMin=mins}
          else{entry.transitChecked=true;entry.transitMin=mins}
          entry.checkedAt=Date.now();
        });
        completed+=chunk.length;
        updateSmartDiag(t,{[doneKey]:completed,done:completed,total:pairs.length,message:`${mode==='walk'?'도보':'대중교통'} ${completed} / ${pairs.length} 계산`});
      }
    }
  }catch(err){
    console.error(`${mode} matrix error`,err);
    updateSmartDiag(t,{phase:'error',failedPhase:phase,message:`${mode==='walk'?'도보':'대중교통'} 계산 단계에서 중단되었습니다.`,error:errorText(err),errorName:err?.name||'ROUTE_MATRIX_ERROR'});
    throw err;
  }
}
function smartEdgeScore(entry){
  const vals=[];if(entry.walkMin!=null)vals.push(entry.walkMin/30);if(entry.transitMin!=null)vals.push(entry.transitMin/15);return vals.length?Math.min(...vals):99;
}
function smartQualifies(entry){return (entry.walkMin!=null&&entry.walkMin<=20)||(entry.transitMin!=null&&entry.transitMin<=10)}
function smartSpreadOK(members){
  if(members.length<=2)return true;
  const lat=members.reduce((s,p)=>s+Number(p.lat),0)/members.length,lng=members.reduce((s,p)=>s+Number(p.lng),0)/members.length;
  if(members.some(p=>distanceKm(lat,lng,p.lat,p.lng)>3))return false;
  for(let i=0;i<members.length;i++)for(let j=i+1;j<members.length;j++)if(distanceKm(members[i].lat,members[i].lng,members[j].lat,members[j].lng)>4)return false;
  return true;
}
function buildSmartGroupsFromCache(t,pairs){
  const pts=t.pool.filter(p=>p.lat!=null&&p.lng!=null),parent=new Map(pts.map(p=>[p.id,p.id])),members=new Map(pts.map(p=>[p.id,[p]]));
  const find=x=>{let r=x;while(parent.get(r)!==r)r=parent.get(r);while(parent.get(x)!==x){const n=parent.get(x);parent.set(x,r);x=n}return r};
  const edges=pairs.map(pair=>({pair,entry:routeCacheEntry(t,pair)})).filter(x=>smartQualifies(x.entry)).sort((a,b)=>smartEdgeScore(a.entry)-smartEdgeScore(b.entry));
  edges.forEach(({pair})=>{
    let ra=find(pair.a.id),rb=find(pair.b.id);if(ra===rb)return;
    const merged=[...(members.get(ra)||[]),...(members.get(rb)||[])];
    if(!smartSpreadOK(merged))return;
    parent.set(rb,ra);members.set(ra,merged);members.delete(rb);
  });
  const groups=[...members.values()];
  t.smartClusters=makeClusterObjects(t,groups,'smart');
  const lookup=new Map();t.smartClusters.forEach(c=>c.memberIds.forEach(id=>lookup.set(id,c.id)));
  t.pool.forEach(p=>p.smartClusterId=lookup.get(p.id)||null);
}
async function ensureSmartGroups(t,force=false,rerender=false){
  if(!t)return;
  if(!getApiKey()){
    updateSmartDiag(t,{phase:'error',failedPhase:'loading_maps',message:'Google API 키가 없습니다.',error:'설정에서 Google Maps Platform API 키를 입력해주세요.',errorName:'NO_API_KEY'},rerender);
    return;
  }
  const pts=t.pool.filter(p=>p.lat!=null&&p.lng!=null);
  if(pts.length<2){
    updateSmartDiag(t,{phase:'idle',message:'좌표가 있는 장소가 2곳 이상 필요합니다.',error:'',errorName:'',done:0,total:0},rerender);
    return;
  }
  const sig=poolCoordSignature(t);
  if(!force&&t.smartPoolSignature===sig&&t.smartClusters.length){
    updateSmartDiag(t,{phase:'done',message:`${pts.length}개 장소의 저장된 계산 결과를 사용 중입니다.`,error:'',errorName:'',done:1,total:1},rerender);
    return;
  }
  const pairs=getCandidatePairs(t,6);
  updateSmartDiag(t,{phase:'loading_maps',message:`후보 ${pairs.length}개 쌍 · Routes 라이브러리 확인 중`,error:'',errorName:'',failedPhase:'',done:0,total:pairs.length,walkDone:0,walkTotal:0,transitDone:0,transitTotal:0},rerender);
  try{
    if(force){
      pairs.forEach(pair=>{
        const e=routeCacheEntry(t,pair);
        e.walkChecked=false;e.transitChecked=false;e.walkMin=null;e.transitMin=null;
      });
    }
    const walkNeed=pairs.filter(pair=>{const e=routeCacheEntry(t,pair);return !e.walkChecked});
    await computePairMode(t,walkNeed,'walk');
    const transitNeed=pairs.filter(pair=>{
      const e=routeCacheEntry(t,pair);
      return !(e.walkMin!=null&&e.walkMin<=20)&&!e.transitChecked;
    });
    if(transitNeed.length)await computePairMode(t,transitNeed,'transit');
    else updateSmartDiag(t,{transitTotal:0,transitDone:0,message:'대중교통 추가 확인이 필요한 후보가 없습니다.'},rerender);
    updateSmartDiag(t,{phase:'grouping',message:'이동시간 결과로 그룹 생성 중',done:0,total:1},rerender);
    buildSmartGroupsFromCache(t,pairs);
    t.smartPoolSignature=sig;
    updateSmartDiag(t,{phase:'done',message:`완료 · ${t.smartClusters.length}개 그룹 생성`,done:1,total:1,error:'',errorName:'',failedPhase:''},rerender);
    save();
    if(rerender&&currentTripId===t.id&&currentTab==='pool'&&poolView==='group'&&groupViewMode==='smart')renderTab();
  }catch(err){
    console.error('Smart grouping error',err);
    if((t.smartDiag||{}).phase!=='error'){
      updateSmartDiag(t,{phase:'error',message:'스마트 그룹 계산이 중단되었습니다.',error:errorText(err),errorName:err?.name||'SMART_GROUP_ERROR'},rerender);
    }
    if(rerender)toast('스마트 이동시간 계산 오류를 확인해주세요');
  }
}
async function refreshSmartGroups(force=false){

function distanceKm(a,b,c,d){const r=x=>x*Math.PI/180,R=6371,dp=r(c-a),dl=r(d-b),q=Math.sin(dp/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(q))}

function formatHourMinute(h,m){const ap=h<12?'오전':'오후',hh=(h%12)||12;return `${ap} ${hh}:${String(m).padStart(2,'0')}`}
function hoursForDate(date,hours,periods){
  const idx=new Date(date+'T12:00:00').getDay(),ko=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'][idx],en=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][idx],ja=['日曜日','月曜日','火曜日','水曜日','木曜日','金曜日','土曜日'][idx];
  if(Array.isArray(periods)&&periods.length){const todays=periods.filter(x=>Number(x.openDay)===idx);if(!todays.length)return `${ko}: 휴무`;return `${ko}: ${todays.map(x=>{const s=formatHourMinute(Number(x.openHour)||0,Number(x.openMinute)||0);if(x.closeHour==null)return `${s}부터`;return `${s}–${formatHourMinute(Number(x.closeHour)||0,Number(x.closeMinute)||0)}`}).join(', ')}`;}
  if(!Array.isArray(hours)||!hours.length)return '';const norm=s=>String(s||'').trim().toLowerCase(),targets=[ko.toLowerCase(),en.toLowerCase(),ja.toLowerCase()];return hours.find(x=>targets.some(t=>norm(x).startsWith(t)))||'';
}

function plansForDate(d){return trip().plans.filter(p=>p.date===d).sort((a,b)=>(a.order??999)-(b.order??999))}
function bindPlanDrag(){
  $$('.plan-card').forEach(card=>{
    const row=card.closest('.plan-row');
    card.addEventListener('dragstart',()=>{dragPlanId=row.dataset.plan;card.classList.add('dragging')});
    card.addEventListener('dragend',()=>{dragPlanId=null;card.classList.remove('dragging');$$('.plan-card').forEach(x=>x.classList.remove('drop-before'))});
    card.addEventListener('dragover',e=>{e.preventDefault();const src=trip().plans.find(p=>p.id===dragPlanId);const target=trip().plans.find(p=>p.id===row.dataset.plan);if(src&&target&&src.date===target.date&&src.id!==target.id)card.classList.add('drop-before')});
    card.addEventListener('dragleave',()=>card.classList.remove('drop-before'));
    card.addEventListener('drop',e=>{e.preventDefault();card.classList.remove('drop-before');movePlanBefore(dragPlanId,row.dataset.plan)});
  });
}
function movePlanBefore(srcId,targetId){
  const t=trip(),src=t.plans.find(p=>p.id===srcId),target=t.plans.find(p=>p.id===targetId);if(!src||!target||src.date!==target.date||src.id===target.id)return;
  const arr=plansForDate(src.date).filter(p=>p.id!==src.id),idx=arr.findIndex(p=>p.id===target.id);arr.splice(idx,0,src);arr.forEach((p,i)=>p.order=i);save();renderTab();toast('순서를 바꿨어요');
}

function getVisitedArchive(){
  const map=new Map();
  state.trips.forEach(t=>{
    normalizeTrip(t);
    t.plans.forEach(p=>{
      const key=p.googlePlaceId||`${t.country}|${t.city}|${p.placeName}`;
      const prev=map.get(key);
      const rec={
        key,country:t.country||'',city:t.city||'',placeName:p.placeName,category:p.category||'기타',
        memo:p.memo||'',address:p.address||'',lat:p.lat,lng:p.lng,mapsUrl:p.mapsUrl||mapsSearch(p.placeName+' '+t.destination),
        googlePlaceId:p.googlePlaceId||'',weekdayHours:p.weekdayHours||[],openingPeriods:p.openingPeriods||[]
      };
      if(!prev)map.set(key,rec);
      else if(!prev.memo&&rec.memo)prev.memo=rec.memo;
    });
  });
  return [...map.values()];
}
function openArchive(){archiveMode=true;currentTripId=null;archiveCountry='전체';archiveCity='전체';archiveCategory='전체';render()}
function renderArchive(){
  const all=getVisitedArchive(),countries=['전체',...new Set(all.map(x=>x.country).filter(Boolean))];
  if(archiveCountry!=='전체'&&!countries.includes(archiveCountry))archiveCountry='전체';
  const cities=['전체',...new Set(all.filter(x=>archiveCountry==='전체'||x.country===archiveCountry).map(x=>x.city).filter(Boolean))];
  if(archiveCity!=='전체'&&!cities.includes(archiveCity))archiveCity='전체';
  const base=all.filter(x=>(archiveCountry==='전체'||x.country===archiveCountry)&&(archiveCity==='전체'||x.city===archiveCity));
  const cats=['전체',...new Set(base.map(x=>x.category).filter(Boolean))];
  if(archiveCategory!=='전체'&&!cats.includes(archiveCategory))archiveCategory='전체';
  const rows=base.filter(x=>archiveCategory==='전체'||x.category===archiveCategory).sort((a,b)=>a.placeName.localeCompare(b.placeName,'ko'));
  $('#view').innerHTML=`<section class="triphead"><button class="back" onclick="archiveMode=false;render()">‹ 여행 목록</button><div class="triptitle">내가 갔던 곳</div><div class="muted">등록한 여행의 일정에 넣어둔 장소를 나라 · 도시별로 모아봅니다.</div></section>
  <div class="card"><div class="grid2"><div class="field" style="margin:0"><label>나라</label><select onchange="setArchiveCountry(this.value)">${countries.map(x=>`<option ${x===archiveCountry?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field" style="margin:0"><label>도시</label><select onchange="setArchiveCity(this.value)">${cities.map(x=>`<option ${x===archiveCity?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div><div class="pool-top" style="margin-top:13px;margin-bottom:0">${cats.map(x=>`<button class="${x===archiveCategory?'primary':'ghost'}" onclick="setArchiveCategory('${esc(x)}')">${esc(x)}</button>`).join('')}</div></div>
  <div class="section-title"><h3>장소 ${rows.length}곳</h3></div>${rows.length?rows.map(archiveCard).join(''):`<div class="card empty">조건에 맞는 방문 장소가 없습니다.</div>`}`;
  $('#fab').innerHTML='';
}
function archiveCard(p){return `<div class="item"><div class="row between"><div><span class="badge">${esc(p.category)}</span><h4 style="margin-top:8px">${esc(p.placeName)}</h4><div class="itemline">${esc([p.country,p.city].filter(Boolean).join(' · '))}${p.address?' · '+esc(p.address):''}</div></div></div>${p.memo?`<div class="memo">${esc(p.memo)}</div>`:''}<div class="actions"><a target="_blank" href="${esc(p.mapsUrl)}">Google 지도</a></div></div>`}
function setArchiveCountry(v){archiveCountry=v;archiveCity='전체';archiveCategory='전체';renderArchive()}
function setArchiveCity(v){archiveCity=v;archiveCategory='전체';renderArchive()}
function setArchiveCategory(v){archiveCategory=v;renderArchive()}

function exportTripPocketData(){
  try{
    const payload={
      app:'Trip Pocket',
      version:28,
      exportedAt:new Date().toISOString(),
      data:JSON.parse(JSON.stringify(state))
    };
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=`trip-pocket-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast('여행 데이터 JSON을 내보냈어요');
  }catch(err){
    console.error('export failed',err);
    toast('내보내기에 실패했어요');
  }
}
async function handleTripImport(event){

  if(!file)return;
  try{
    const raw=await file.text(),payload=JSON.parse(raw),incoming=payload?.data||payload;
    if(!incoming||!Array.isArray(incoming.trips))throw new Error('Trip Pocket 여행 데이터 형식이 아닙니다.');
    const merged=JSON.parse(JSON.stringify(state));
    merged.trips=Array.isArray(merged.trips)?merged.trips:[];
    const index=new Map(merged.trips.map((t,i)=>[t.id,i]));
    incoming.trips.forEach(it=>{
      normalizeTrip(it);
      if(index.has(it.id))merged.trips[index.get(it.id)]=it;
      else{index.set(it.id,merged.trips.length);merged.trips.push(it)}
    });
    if(incoming.currentTripId&&merged.trips.some(t=>t.id===incoming.currentTripId))merged.currentTripId=incoming.currentTripId;
    state=merged;
    state.trips.forEach(normalizeTrip);
    currentTripId=state.currentTripId||state.trips[0]?.id||null;
    save();
    render();
    closeBackupModal();toast(`${incoming.trips.length}개 여행 데이터를 가져왔어요`);
  }catch(err){
    console.error('import failed',err);
    alert('가져오기에 실패했습니다.\\n\\n'+errorText(err));
  }
}

normalizeTrip=tp20EnsureTrip;

function tp20NormalizeExpense(e,t,i){
  const members=(e.members&&e.members.length)?e.members:[e.payer||'나'];
  let shares=e.shares||{};
  members.forEach(m=>{if(shares[m]==null)shares[m]=0});
  if(!Object.values(shares).some(v=>Number(v)>0) && Number(e.amount||0)>0){
    const per=Number(e.amount||0)/members.length;
    shares={}; members.forEach((m,idx)=>shares[m]=idx===members.length-1?Number((Number(e.amount||0)-per*(members.length-1)).toFixed(2)):Number(per.toFixed(2)));
  }
  const krwAmount=Number(e.krwAmount|| (e.currency==='KRW'? Number(e.amount||0):0));
  const shareKrw={...(e.shareKrw||{})};
  if(krwAmount && (!e.shareKrw || !Object.keys(e.shareKrw).length)){
    Object.entries(shares).forEach(([k,v])=>shareKrw[k]=Number(e.amount)? Number((krwAmount*(Number(v)/Number(e.amount))).toFixed(0)):0);
  }
  return {
    id:e.id||uid(),
    date:e.date||todayISO(),
    dayLabel:e.dayLabel||tp20DayLabel(e.date||todayISO(),t),
    payMethod:e.payMethod||'카드',
    payer:e.payer||'나',
    members,
    merchant:e.merchant||'',
    amount:Number(e.amount||0),
    currency:e.currency||'JPY',
    category:e.category||t.expenseCategories[0]||'기타',
    rateMode:e.rateMode||'historic',
    rate:Number(e.rate|| (e.currency==='KRW'?1:0)),
    rateDate:e.rateDate||'',
    rateDisplay:e.rateDisplay||'',
    manualRateInput:e.manualRateInput||'',
    splitMode:e.splitMode||'equal',
    shares,
    shareKrw,
    krwAmount,
    memo:e.memo||'',
    createdAt:e.createdAt||Date.now()+i
  };
}
function tp20FmtNum(n){return Number(n||0).toLocaleString('ko-KR')}
function tp20FmtKRW(n){return '₩'+tp20FmtNum(Math.round(Number(n||0)))}
function tp20CurrencySymbol(c){return c==='JPY'?'¥':c==='USD'?'$':c==='EUR'?'€':c==='KRW'?'₩':c+' '}
function tp20FmtMoney(amount,currency){return (currency==='KRW'?'₩':tp20CurrencySymbol(currency))+tp20FmtNum(Number(amount||0))}
function tp20NightCount(a,b){if(!a||!b)return 0;return Math.max(0,Math.round((new Date(b)-new Date(a))/86400000))}
function tp20DayLabel(date,t){
  if(!date||!t?.start)return '';
  if(date<t.start)return '여행 전';
  if(date>t.end)return '여행 후';
  const diff=Math.round((new Date(date)-new Date(t.start))/86400000);
  return `${diff+1}일차`;
}
function tp20AllTripDays(t){
  const arr=['여행 전']; const n=tp20NightCount(t.start,t.end)+1;
  for(let i=1;i<=n;i++)arr.push(`${i}일차`);
  return arr;
}
function tp20FetchRateFor(date,currency,mode,manualInput){
  currency=currency||'JPY';
  if(currency==='KRW')return Promise.resolve({rate:1,rateDate:date||todayISO(),display:'원화 결제'});
  if(mode==='manual'){
    const unit=(currency==='JPY'?100:1),input=Number(manualInput||0);
    if(!input || input<=0)return Promise.reject(new Error('직접 입력 환율을 확인해주세요.'));
    const rate=input/unit;
    return Promise.resolve({rate,rateDate:'manual',display:`${unit} ${currency} = ${tp20FmtNum(input)} KRW`});
  }
  const base=mode==='current'?'latest':date;
  return fetch(`https://api.frankfurter.app/${base}?from=${currency}&to=KRW`)
    .then(r=>r.json())
    .then(j=>{
      if(!j || !j.rates || j.rates.KRW==null)throw new Error('환율 정보를 불러오지 못했습니다.');
      const rate=Number(j.rates.KRW);
      const unit=(currency==='JPY'?100:1);
      const display=`${unit} ${currency} = ${tp20FmtNum((rate*unit).toFixed(currency==='JPY'?2:4))} KRW`;
      return {rate,rateDate:j.date||base,display};
    });
}

function tp20DonutHTML(dataObj,total,subtitle){
  const entries=Object.entries(dataObj).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  if(!entries.length)return `<div class="empty-note2">아직 등록한 지출이 없습니다.</div>`;
  const colors=tp20ColorPalette(); let acc=0;
  const grad=entries.map(([k,v],i)=>{const start=acc/total*360;acc+=v;const end=acc/total*360;return `${colors[i%colors.length]} ${start}deg ${end}deg`;}).join(',');
  const legend=entries.map(([k,v],i)=>`<div class="legend-row2"><div class="legend-left"><span class="dot2" style="background:${colors[i%colors.length]}"></span><span>${esc(k)}</span></div><div>${tp20FmtKRW(v)} (${(v/total*100).toFixed(1)}%)</div></div>`).join('');
  return `<div class="donut-wrap"><div class="donut" style="background:conic-gradient(${grad})"><div class="donut-center"><div class="donut-total">${tp20FmtKRW(total)}</div><div class="donut-sub">${subtitle||'합계 최종 결제 (원화)'}</div></div></div><div class="legend2">${legend}</div></div>`;
}
function tp20BarHTML(dayObj){
  const entries=Object.entries(dayObj).filter(([,v])=>v>0);
  if(!entries.length)return `<div class="empty-note2">일자별 지출이 아직 없습니다.</div>`;
  const order=(label)=>label==='여행 전'?-1:label==='여행 후'?999:Number(label.replace('일차',''))||0;
  entries.sort((a,b)=>order(a[0])-order(b[0]));
  const max=Math.max(...entries.map(x=>x[1]),1);
  return `<div class="barwrap">${entries.map(([k,v],i)=>{
    const h=Math.max(8,Math.round(v/max*126));
    const colors=tp20ColorPalette();
    return `<div class="barcol"><div class="barvalue">${tp20FmtKRW(v)}</div><div class="bar" style="height:${h}px;background:${colors[i%colors.length]}"></div><div class="barlabel">${esc(k)}</div></div>`
  }).join('')}</div>`;

function tp20ChecklistProgress(group){

function tp20PackingProgress(t){
  const total=t.packingItems.length,done=t.packingItems.filter(x=>x.checked).length;
  return {total,done,pct:total?Math.round(done/total*100):0};

function tp20Settlement(t){
  const net={}; (t.expenseMembers||[]).forEach(m=>net[m]=0);
  t.expenses.forEach(e=>{
    const total=Number(e.krwAmount||0);
    net[e.payer]=(net[e.payer]||0)+total;
    Object.entries(e.shareKrw||{}).forEach(([p,v])=>net[p]=(net[p]||0)-Number(v||0));
  });
  const creditors=Object.entries(net).filter(([,v])=>v>1).map(([p,v])=>({p,amt:v})).sort((a,b)=>b.amt-a.amt);
  const debtors=Object.entries(net).filter(([,v])=>v<-1).map(([p,v])=>({p,amt:-v})).sort((a,b)=>b.amt-a.amt);
  const transfers=[];
  let i=0,j=0;
  while(i<debtors.length && j<creditors.length){
    const pay=Math.min(debtors[i].amt,creditors[j].amt);
    if(pay>0)transfers.push({from:debtors[i].p,to:creditors[j].p,amount:Math.round(pay)});
    debtors[i].amt-=pay; creditors[j].amt-=pay;
    if(debtors[i].amt<=1)i++;
    if(creditors[j].amt<=1)j++;
  }
  return {net,transfers};
}

function tp20RenderPackingItems(){
  const t=trip(); const items=[...t.packingItems];
  if(!items.length)return `<div class="empty-note2">아직 등록한 준비물이 없습니다.<br>오른쪽 위 버튼으로 준비물을 추가해보세요.</div>`;
  const prog=tp20PackingProgress(t);
  let body='';
  if(packingView==='all'){
    body=items.sort((a,b)=>(a.checked-b.checked)||((a.createdAt||0)-(b.createdAt||0))).map(tp20PackingCard).join('');
  }else if(packingView==='category'){
    const groups=[...new Set(items.map(x=>x.category))];
    body=groups.map(g=>`<div class="group-title2">${esc(g)}</div>${items.filter(x=>x.category===g).map(tp20PackingCard).join('')}`).join('');
  }else if(packingView==='location'){
    const groups=[...new Set(items.map(x=>x.location))];
    body=groups.map(g=>`<div class="group-title2">${esc(g)}</div>${items.filter(x=>x.location===g).map(tp20PackingCard).join('')}`).join('');
  }else{
    const unchecked=items.filter(x=>!x.checked), checked=items.filter(x=>x.checked);
    body=`<div class="group-title2">아직 안 챙김</div>${unchecked.length?unchecked.map(tp20PackingCard).join(''):`<div class="empty-note2">전부 챙겼어요.</div>`}
          <div class="group-title2">챙김 완료</div>${checked.length?checked.map(tp20PackingCard).join(''):`<div class="empty-note2">아직 없습니다.</div>`}`;
  }
  return `<div class="overview-head"><h4>준비물 ${prog.done}/${prog.total} 챙김</h4><span class="home-badge">${prog.pct}%</span></div>
    <div class="filter-row">
      <button class="filter-chip ${packingView==='all'?'active':''}" onclick="packingView='all';renderTab()">전체 목록</button>
      <button class="filter-chip ${packingView==='category'?'active':''}" onclick="packingView='category';renderTab()">카테고리별</button>
      <button class="filter-chip ${packingView==='location'?'active':''}" onclick="packingView='location';renderTab()">위치별</button>
      <button class="filter-chip ${packingView==='status'?'active':''}" onclick="packingView='status';renderTab()">체크 여부별</button>
    </div>
    <div class="item-list2">${body}</div>`;
}

function tp20ManageExpenseCats(){
  const t=trip(); const input=prompt('정산 카테고리를 콤마(,)로 구분해서 입력해주세요.', (t.expenseCategories||[]).join(', ')); if(input==null)return;
